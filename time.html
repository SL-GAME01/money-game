<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 森林小动物的数学大冒险 🐾</title>
    <style>
        :root {
            --bg-color: #fce4ec;
            --card-bg: #ffffff;
            --primary-color: #ff80ab;
            --primary-dark: #f50057;
            --text-color: #4a148c;
            --btn-bg: #80deea;
            --btn-hover: #4dd0e1;
        }

        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background-color: var(--card-bg);
            border: 4px solid var(--primary-color);
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 750px;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .level-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-dark);
        }

        .score-board {
            font-size: 18px;
            background: #fff9c4;
            padding: 5px 15px;
            border-radius: 15px;
            border: 2px solid #fbc02d;
        }

        .question-box {
            font-size: 20px;
            margin: 20px 0;
            min-height: 80px;
        }

        /* 输入框样式 */
        input[type="text"], input[type="number"] {
            font-size: 20px;
            padding: 8px 15px;
            border: 3px solid var(--primary-color);
            border-radius: 12px;
            text-align: center;
            width: 120px;
            outline: none;
        }

        /* 选项按钮 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            background-color: var(--btn-bg);
            color: #004d40;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px #00acc1;
            transition: all 0.1s;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .btn:active {
            box-shadow: 0 1px #00acc1;
            transform: translateY(3px);
        }

        /* 排序卡片 */
        .drag-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .card-item {
            background: #ffe0b2;
            border: 2px solid #fb8c00;
            padding: 10px 18px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
        }

        /* 小白板区域 */
        .whiteboard-container {
            margin: 15px 0;
            display: none;
        }

        canvas {
            border: 3px dashed #b0bec5;
            background-color: #fafafa;
            border-radius: 15px;
            cursor: crosshair;
            touch-action: none;
        }

        .tools {
            margin-top: 8px;
        }

        .feedback {
            font-size: 20px;
            font-weight: bold;
            height: 30px;
            margin-top: 15px;
        }

        .correct { color: #43a047; }
        .wrong { color: #e53935; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="level-title" id="level-name">🌟 第 1 关：数位城堡</div>
        <div class="score-board">⭐ 积分：<span id="score">0</span></div>
    </div>

    <!-- 题目区域 -->
    <div id="game-body">
        <div class="question-box" id="question-text">题目加载中...</div>

        <!-- 交互区域 1：直接输入/填空 -->
        <div id="input-zone" class="interactive-zone">
            <input type="number" id="user-input" placeholder="答案">
            <button class="btn" onclick="checkInputAnswer()">提交</button>
        </div>

        <!-- 交互区域 2：选择题 -->
        <div id="choice-zone" class="interactive-zone options-grid hidden"></div>

        <!-- 交互区域 3：排序选择 -->
        <div id="sort-zone" class="interactive-zone hidden">
            <p style="font-size:14px; color:#666;">点击下方卡片按顺序排列：</p>
            <div class="drag-container" id="cards-pool"></div>
            <div style="margin-top:10px;">你的排序：<span id="sorted-result" style="font-weight:bold; color:var(--primary-dark);"></span></div>
            <button class="btn" style="margin-top:10px;" onclick="resetSort()">重置排序</button>
            <button class="btn" style="margin-top:10px; background:#a5d6a7;" onclick="checkSortAnswer()">确认提交</button>
        </div>

        <!-- 交互区域 4：加减乘除小白板算草区 -->
        <div id="whiteboard-zone" class="whiteboard-container">
            <p style="font-size:14px; color:#555; margin:5px;">🎨 算草小白板（用手指或鼠标在此列竖式）：</p>
            <canvas id="scratch-pad" width="400" height="150"></canvas>
            <div class="tools">
                <button class="btn" style="padding:5px 10px; font-size:14px; background:#ef9a9a;" onclick="clearCanvas()">清空画板</button>
            </div>
            <div style="margin-top:15px;">
                最终答案：<input type="number" id="whiteboard-input" placeholder="输入答案">
                <button class="btn" onclick="checkWhiteboardAnswer()">提交答案</button>
            </div>
        </div>

        <div class="feedback" id="feedback-message"></div>
    </div>

    <!-- 通关结算界面 -->
    <div id="finish-screen" class="hidden">
        <h2>🎉 恭喜通关！小动物们太感谢你啦！ 🐾</h2>
        <p style="font-size:22px;">你的总得分是：<span id="final-score" style="color:var(--primary-dark); font-weight:bold;">0</span> 分</p>
        <button class="btn" onclick="location.reload()">再玩一次 🚀</button>
    </div>
</div>

<script>
    // 关卡题目设计
    const gameLevels = [
        // 第1关：数位填空
        { level: 1, name: "🌟 第 1 关：数位城堡（填空）", type: "input", q: "🐱 852 中，数字 5 的数值是多少？", a: 50 },
        
        // 第2关：比较大小选择题
        { level: 2, name: "🥊 第 2 关：比大小擂台（选择）", type: "choice", q: "🐰 比较 654 和 430，哪个数目比较大？", choices: ["654", "430"], a: "654" },
        
        // 第3关：排序
        { level: 3, name: "🚂 第 3 关：数字火车（从小到大排序）", type: "sort", q: "🐻 请将这组数字按【从小到大（顺序）】排列：", cards: [654, 198, 430, 312], a: [198, 312, 430, 654] },
        
        // 第4关：近似值
        { level: 4, name: "🪄 第 4 关：近似值魔法（填空）", type: "input", q: "🦊 468 的【十位近似值】是多少？", a: 470 },
        
        // 第5关：加减乘除 + 小白板
        { level: 5, name: "📝 第 5 关：终极计算（小白板做算草）", type: "whiteboard", q: "🐶 妈妈烤了 32 块饼干，平分给 4 个小朋友，每人分得多少块？（可在下方画板列竖式）", a: 8 }
    ];

    let currentStep = 0;
    let totalScore = 0;
    let selectedCards = [];

    // 初始化画板
    const canvas = document.getElementById('scratch-pad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    function startDrawing(e) {
        isDrawing = true;
        ctx.beginPath();
        const pos = getPos(e);
        ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        const pos = getPos(e);
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#37474f';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function stopDrawing() { isDrawing = false; }
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    // 载入关卡
    function loadLevel() {
        const currentData = gameLevels[currentStep];
        document.getElementById('level-name').innerText = currentData.name;
        document.getElementById('question-text').innerText = currentData.q;
        document.getElementById('feedback-message').innerText = '';

        // 隐藏所有区域
        document.getElementById('input-zone').classList.add('hidden');
        document.getElementById('choice-zone').classList.add('hidden');
        document.getElementById('sort-zone').classList.add('hidden');
        document.getElementById('whiteboard-zone').style.display = 'none';

        if (currentData.type === 'input') {
            document.getElementById('input-zone').classList.remove('hidden');
            document.getElementById('user-input').value = '';
        } else if (currentData.type === 'choice') {
            const choiceZone = document.getElementById('choice-zone');
            choiceZone.classList.remove('hidden');
            choiceZone.innerHTML = '';
            currentData.choices.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => checkChoiceAnswer(opt);
                choiceZone.appendChild(btn);
            });
        } else if (currentData.type === 'sort') {
            document.getElementById('sort-zone').classList.remove('hidden');
            selectedCards = [];
            renderSortCards();
        } else if (currentData.type === 'whiteboard') {
            document.getElementById('whiteboard-zone').style.display = 'block';
            document.getElementById('whiteboard-input').value = '';
            clearCanvas();
        }
    }

    // 检查输入题
    function checkInputAnswer() {
        const val = Number(document.getElementById('user-input').value);
        verifyAnswer(val === gameLevels[currentStep].a);
    }

    // 检查选择题
    function checkChoiceAnswer(opt) {
        verifyAnswer(opt == gameLevels[currentStep].a);
    }

    // 渲染与检查排序题
    function renderSortCards() {
        const pool = document.getElementById('cards-pool');
        pool.innerHTML = '';
        const currentData = gameLevels[currentStep];

        currentData.cards.forEach(num => {
            if (!selectedCards.includes(num)) {
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerText = num;
                card.onclick = () => { selectedCards.push(num); renderSortCards(); };
                pool.appendChild(card);
            }
        });
        document.getElementById('sorted-result').innerText = selectedCards.join(' ➔ ');
    }

    function resetSort() { selectedCards = []; renderSortCards(); }

    function checkSortAnswer() {
        const target = gameLevels[currentStep].a;
        const isCorrect = JSON.stringify(selectedCards) === JSON.stringify(target);
        verifyAnswer(isCorrect);
    }

    // 检查小白板计算题
    function checkWhiteboardAnswer() {
        const val = Number(document.getElementById('whiteboard-input').value);
        verifyAnswer(val === gameLevels[currentStep].a);
    }

    // 统一核对逻辑
    function verifyAnswer(isCorrect) {
        const fb = document.getElementById('feedback-message');
        if (isCorrect) {
            fb.innerText = "✨ 回答正确！好棒！";
            fb.className = "feedback correct";
            totalScore += 20;
            document.getElementById('score').innerText = totalScore;
            setTimeout(() => {
                currentStep++;
                if (currentStep < gameLevels.length) {
                    loadLevel();
                } else {
                    showFinalScreen();
                }
            }, 1200);
        } else {
            fb.innerText = "❌ 答错了，再试一次哦！";
            fb.className = "feedback wrong";
        }
    }

    function showFinalScreen() {
        document.getElementById('game-body').classList.add('hidden');
        document.getElementById('finish-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = totalScore;
    }

    // 启动游戏
    loadLevel();
</script>
</body>
</html>
