<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 4年级数学：森林大冒险 🌲</title>
    <style>
        :root {
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --primary-color: #4caf50;
            --primary-dark: #2e7d32;
            --text-color: #333333;
        }

        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .game-container {
            background-color: var(--card-bg);
            border: 4px solid var(--primary-color);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 800px;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed var(--primary-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .level-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-dark);
        }

        .progress-info {
            font-size: 16px;
            background: #fff8e1;
            padding: 6px 14px;
            border-radius: 12px;
            border: 2px solid #ffe082;
            font-weight: bold;
        }

        .question-box {
            font-size: 19px;
            margin: 15px 0;
            line-height: 1.6;
            min-height: 60px;
        }

        input[type="text"] {
            font-size: 18px;
            padding: 8px 12px;
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            text-align: center;
            outline: none;
            margin: 4px;
        }

        .btn {
            background-color: #81c784;
            color: #1b5e20;
            border: none;
            padding: 10px 20px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px #388e3c;
            transition: all 0.1s;
            margin: 5px;
        }

        .btn:hover { background-color: #66bb6a; }
        .btn:active { box-shadow: 0 1px #388e3c; transform: translateY(3px); }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .drag-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .card-item {
            background: #ffe0b2;
            border: 2px solid #fb8c00;
            padding: 10px 16px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
        }

        .feedback {
            font-size: 18px;
            font-weight: bold;
            height: 28px;
            margin-top: 12px;
        }

        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="level-title" id="level-name">关卡加载中...</div>
        <div class="progress-info">第 <span id="current-q">1</span> / <span id="total-q">0</span> 题</div>
    </div>

    <div id="game-body">
        <div class="question-box" id="question-text">题目加载中...</div>

        <!-- 交互 1：填空题 -->
        <div id="input-zone" class="interactive-zone">
            <div id="multi-inputs-container"></div>
            <button class="btn" onclick="checkInputAnswer()" style="margin-top:15px;">提交答案</button>
        </div>

        <!-- 交互 2：选择题 -->
        <div id="choice-zone" class="interactive-zone options-grid hidden"></div>

        <!-- 交互 3：排序题 -->
        <div id="sort-zone" class="interactive-zone hidden">
            <p style="font-size:14px; color:#666;">点击卡片依次选择排列：</p>
            <div class="drag-container" id="cards-pool"></div>
            <div>已选择：<span id="sorted-result" style="font-weight:bold; color:var(--primary-dark);"></span></div>
            <button class="btn" style="background:#e0e0e0;" onclick="resetSort()">重置排序</button>
            <button class="btn" onclick="checkSortAnswer()">确认提交</button>
        </div>

        <div class="feedback" id="feedback-message"></div>
    </div>

    <!-- 通关界面 -->
    <div id="finish-screen" class="hidden">
        <h2>🎉 恭喜！你已顺利通关第 1 至第 4 关所有的挑战！ 🏆</h2>
        <button class="btn" onclick="location.reload()">重新开始大冒险 🚀</button>
    </div>
</div>

<script>
    // 关卡 1 到 关卡 4 的全部题目
    const questionsDatabase = [
        // --- 关卡 1：数位与数值分析式 ---
        { category: "🏰 第一关：数位与数值分析式", type: "multi-input", q: "填一填：48 215 = (a)个万 + (b)个千 + (c)个百 + (d)个十 + (e)个一", inputs: ["a", "b", "c", "d", "e"], a: ["4", "8", "2", "1", "5"] },
        { category: "🏰 第一关：数位与数值分析式", type: "multi-input", q: "填一填：39 608 = (a) + (b) + (c) + (d) + (e)", inputs: ["万位", "千位", "百位", "十位", "个位"], a: ["3个万", "9个千", "6个百", "0个十", "8个一"] },
        { category: "🏰 第一关：数位与数值分析式", type: "multi-input", q: "填一填：63 752 = 60 000 + (a) + (b) + (c) + (d)", inputs: ["a", "b", "c", "d"], a: ["3000", "700", "50", "2"] },
        { category: "🏰 第一关：数位与数值分析式", type: "multi-input", q: "填一填：19 148 = (a) + (b) + (c) + (d) + (e)", inputs: ["a", "b", "c", "d", "e"], a: ["10000", "9000", "100", "40", "8"] },

        // --- 关卡 2：比较数目 ---
        { category: "🥊 第二关：比较数目", type: "choice", q: "圈出比较大的数目：[21 679] 与 [12 679]", choices: ["21679", "12679"], a: "21679" },
        { category: "🥊 第二关：比较数目", type: "choice", q: "圈出比较大的数目：[51 630] 与 [50 163]", choices: ["51630", "50163"], a: "51630" },
        { category: "🥊 第二关：比较数目", type: "choice", q: "圈出比较大的数目：[38 256] 与 [38 265]", choices: ["38256", "38265"], a: "38265" },
        { category: "🥊 第二关：比较数目", type: "choice", q: "圈出比较大的数目：[66 689] 与 [66 886]", choices: ["66689", "66886"], a: "66886" },

        // --- 关卡 3：排列数目 ---
        { category: "🚂 第三关：排列数目", type: "sort", q: "请按【顺序（从小到大）】排列：", cards: ["77629", "26779", "76279", "62297", "26279"], a: ["26279", "26779", "62297", "76279", "77629"] },
        { category: "🚂 第三关：排列数目", type: "sort", q: "请按【逆序（从大到小）】排列：", cards: ["31584", "13458", "54831", "45318", "13584"], a: ["54831", "45318", "31584", "13584", "13458"] },

        // --- 关卡 4：写出近似值 ---
        { category: "🪄 第四关：写出近似值", type: "multi-input", q: "15 635 的【十位近似值】是多少？", inputs: ["答案"], a: ["15640"] },
        { category: "🪄 第四关：写出近似值", type: "multi-input", q: "27 834 的【十位近似值】是多少？", inputs: ["答案"], a: ["27830"] },
        { category: "🪄 第四关：写出近似值", type: "multi-input", q: "32 194 的【千位近似值】是多少？", inputs: ["答案"], a: ["32000"] },
        { category: "🪄 第四关：写出近似值", type: "multi-input", q: "72 708 的【千位近似值】是多少？", inputs: ["答案"], a: ["73000"] },
        { category: "🪄 第四关：写出近似值", type: "multi-input", q: "80 245 的【万位近似值】是多少？", inputs: ["答案"], a: ["80000"] },
        { category: "🪄 第四关：写出近似值", type: "multi-input", q: "46 671 的【万位近似值】是多少？", inputs: ["答案"], a: ["50000"] },
        { category: "🪄 第四关：写出近似值", type: "multi-input", q: "54 972 的【百位近似值】是多少？", inputs: ["答案"], a: ["55000"] },
        { category: "🪄 第四关：写出近似值", type: "multi-input", q: "66 409 的【百位近似值】是多少？", inputs: ["答案"], a: ["66400"] }
    ];

    let currentIndex = 0;
    let selectedSortCards = [];

    function loadQuestion() {
        const item = questionsDatabase[currentIndex];
        document.getElementById('level-name').innerText = item.category;
        document.getElementById('question-text').innerText = item.q;
        document.getElementById('current-q').innerText = currentIndex + 1;
        document.getElementById('total-q').innerText = questionsDatabase.length;
        document.getElementById('feedback-message').innerText = '';

        document.getElementById('input-zone').classList.add('hidden');
        document.getElementById('choice-zone').classList.add('hidden');
        document.getElementById('sort-zone').classList.add('hidden');

        if (item.type === 'multi-input') {
            document.getElementById('input-zone').classList.remove('hidden');
            const container = document.getElementById('multi-inputs-container');
            container.innerHTML = '';
            item.inputs.forEach((lbl, idx) => {
                const inp = document.createElement('input');
                inp.type = 'text';
                inp.id = 'inp-' + idx;
                inp.placeholder = lbl;
                container.appendChild(inp);
            });
        } else if (item.type === 'choice') {
            const choiceZone = document.getElementById('choice-zone');
            choiceZone.classList.remove('hidden');
            choiceZone.innerHTML = '';
            item.choices.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => verifyAnswer(opt === item.a);
                choiceZone.appendChild(btn);
            });
        } else if (item.type === 'sort') {
            document.getElementById('sort-zone').classList.remove('hidden');
            selectedSortCards = [];
            renderSortCards();
        }
    }

    function checkInputAnswer() {
        const item = questionsDatabase[currentIndex];
        let correct = true;
        item.inputs.forEach((_, idx) => {
            const val = document.getElementById('inp-' + idx).value.trim();
            if (val !== item.a[idx]) correct = false;
        });
        verifyAnswer(correct);
    }

    function renderSortCards() {
        const pool = document.getElementById('cards-pool');
        pool.innerHTML = '';
        const item = questionsDatabase[currentIndex];
        item.cards.forEach(num => {
            if (!selectedSortCards.includes(num)) {
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerText = num;
                card.onclick = () => { selectedSortCards.push(num); renderSortCards(); };
                pool.appendChild(card);
            }
        });
        document.getElementById('sorted-result').innerText = selectedSortCards.join(' ➔ ');
    }

    function resetSort() { selectedSortCards = []; renderSortCards(); }

    function checkSortAnswer() {
        const target = questionsDatabase[currentIndex].a;
        const isCorrect = JSON.stringify(selectedSortCards) === JSON.stringify(target);
        verifyAnswer(isCorrect);
    }

    function verifyAnswer(isCorrect) {
        const fb = document.getElementById('feedback-message');
        if (isCorrect) {
            fb.innerText = "✨ 回答正确！很棒！";
            fb.className = "feedback correct";
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < questionsDatabase.length) {
                    loadQuestion();
                } else {
                    document.getElementById('game-body').classList.add('hidden');
                    document.getElementById('finish-screen').classList.remove('hidden');
                }
            }, 1000);
        } else {
            fb.innerText = "❌ 答错了，请仔细检查后再试！";
            fb.className = "feedback wrong";
        }
    }

    loadQuestion();
</script>
</body>
</html>
