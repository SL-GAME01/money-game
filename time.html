<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：时空大冒险游戏</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans SC', 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        canvas {
            touch-action: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .btn-bounce {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-bounce:hover {
            transform: translateY(-3px) scale(1.02);
        }
        .btn-bounce:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Custom Scrollbar for Modal */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-2 sm:p-4 text-white">

    <!-- Main Game Container -->
    <div class="w-full max-w-4xl flex flex-col items-center">
        <!-- Top Title Bar -->
        <header class="w-full text-center my-2 sm:my-4 flex flex-col items-center">
            <div class="inline-flex items-center space-x-3 bg-indigo-900/60 px-6 py-2 rounded-full border border-indigo-400/30 shadow-lg">
                <i class="fa-solid fa-clock text-amber-300 text-2xl animate-spin" style="animation-duration: 10s;"></i>
                <h1 class="text-2xl sm:text-3xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-300 to-yellow-200">
                    时空大冒险：三年级时间数学关卡
                </h1>
            </div>
        </header>

        <!-- Top Stats / Controls Bar -->
        <div class="w-full glass-card rounded-2xl p-3 mb-3 flex flex-wrap items-center justify-between text-sm sm:text-base font-bold gap-2">
            <!-- Level Indicator -->
            <div class="flex items-center space-x-2 bg-indigo-950/50 px-3 py-1.5 rounded-xl border border-indigo-500/30">
                <span class="text-amber-400"><i class="fa-solid fa-layer-group"></i> 关卡:</span>
                <span id="levelDisplay" class="text-cyan-300">第一关 (基础篇)</span>
            </div>

            <!-- Score -->
            <div class="flex items-center space-x-2 bg-indigo-950/50 px-3 py-1.5 rounded-xl border border-indigo-500/30">
                <span class="text-amber-400"><i class="fa-solid fa-star text-yellow-400"></i> 得分:</span>
                <span id="scoreDisplay" class="text-yellow-300 text-lg font-black">0</span>
            </div>

            <!-- Combo -->
            <div class="flex items-center space-x-2 bg-indigo-950/50 px-3 py-1.5 rounded-xl border border-indigo-500/30">
                <span class="text-amber-400"><i class="fa-solid fa-bolt text-amber-400"></i> 连击:</span>
                <span id="comboDisplay" class="text-orange-400 font-black">0 x</span>
            </div>

            <!-- Scratchpad & Sound Buttons -->
            <div class="flex items-center space-x-2">
                <button id="scratchBtn" onclick="toggleScratchpad()" class="btn-bounce bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded-xl flex items-center space-x-1 shadow">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span class="hidden sm:inline">草稿纸</span>
                </button>
                <button id="soundBtn" onclick="toggleSound()" class="btn-bounce bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl flex items-center space-x-1 shadow">
                    <i id="soundIcon" class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>

        <!-- Main Game Canvas Container -->
        <div class="relative w-full aspect-[4/3] max-h-[560px] rounded-2xl overflow-hidden glass-card shadow-2xl border border-indigo-400/30">
            <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

            <!-- Scratchpad Overlay Canvas -->
            <canvas id="scratchCanvas" class="absolute inset-0 w-full h-full hidden pointer-events-auto bg-white/90 z-20"></canvas>

            <!-- Scratchpad Control Bar (Visible when scratchpad open) -->
            <div id="scratchControls" class="absolute top-3 right-3 z-30 hidden flex items-center space-x-2 bg-slate-900/80 p-2 rounded-xl backdrop-blur border border-slate-700">
                <button onclick="setScratchColor('#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border-2 border-white hover:scale-110 transition"></button>
                <button onclick="setScratchColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border-2 border-white hover:scale-110 transition"></button>
                <button onclick="setScratchColor('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white hover:scale-110 transition"></button>
                <button onclick="setScratchColor('#000000')" class="w-6 h-6 rounded-full bg-black border-2 border-white hover:scale-110 transition"></button>
                <button onclick="clearScratchpad()" class="bg-amber-600 hover:bg-amber-500 text-white px-2 py-1 text-xs rounded-lg font-bold">清空</button>
                <button onclick="toggleScratchpad()" class="bg-red-600 hover:bg-red-500 text-white px-2 py-1 text-xs rounded-lg font-bold">关闭</button>
            </div>
        </div>

        <!-- Explanation / Hint Modal -->
        <div id="explanationModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="glass-card bg-slate-900/90 max-w-lg w-full rounded-2xl p-6 border border-indigo-500/50 shadow-2xl flex flex-col space-y-4">
                <div class="flex items-center justify-between border-b border-indigo-500/30 pb-3">
                    <h3 class="text-xl font-bold text-amber-300 flex items-center space-x-2">
                        <i class="fa-solid fa-lightbulb text-yellow-400"></i>
                        <span id="modalTitle">题目解析与步骤</span>
                    </h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="modalBody" class="text-slate-200 text-base leading-relaxed space-y-2 max-h-80 overflow-y-auto pr-1">
                    <!-- Populated dynamically -->
                </div>
                <div class="pt-2 flex justify-end">
                    <button onclick="closeModal()" class="btn-bounce bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl font-bold shadow-lg">
                        明白啦！下一步 <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Level Complete / Game Win Modal -->
        <div id="winModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
            <div class="glass-card bg-indigo-950/95 max-w-md w-full rounded-3xl p-6 border-2 border-amber-400/60 shadow-2xl text-center flex flex-col items-center space-y-4">
                <div class="w-20 h-20 rounded-full bg-amber-400/20 flex items-center justify-center text-4xl text-amber-300 border-2 border-amber-400 animate-bounce">
                    🏆
                </div>
                <h2 id="winTitle" class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-amber-400">
                    第一关通关成功！
                </h2>
                <p id="winMessage" class="text-slate-300 text-sm sm:text-base">
                    太棒了！你完美掌握了时间的基础换算！准备好迎接第二关的高难度挑战了吗？
                </p>

                <div class="w-full bg-indigo-900/60 rounded-xl p-3 border border-indigo-700/50 flex justify-around font-bold text-base">
                    <div>
                        <div class="text-gray-400 text-xs">总得分</div>
                        <div id="finalScore" class="text-yellow-300 text-xl font-black">0</div>
                    </div>
                    <div>
                        <div class="text-gray-400 text-xs">正确率</div>
                        <div id="finalAccuracy" class="text-emerald-400 text-xl font-black">100%</div>
                    </div>
                </div>

                <div id="winModalActions" class="w-full flex space-x-3 pt-2">
                    <button id="nextLevelBtn" onclick="startNextLevel()" class="flex-1 btn-bounce bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg">
                        进入第二关 <i class="fa-solid fa-angles-right ml-1"></i>
                    </button>
                    <button onclick="restartCurrentLevel()" class="btn-bounce bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg">
                        <i class="fa-solid fa-rotate-left"></i> 重玩
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Questions derived directly from the Grade 3 textbook page in the image
        const questionBank = {
            level1: [
                {
                    id: 1,
                    num: "问题 1",
                    question: "84 个月是多少年？",
                    options: ["A. 7 年", "B. 8 年", "C. 9 年", "D. 10 年"],
                    answer: 0,
                    explanation: "💡 <b>计算步骤：</b><br>1 年 = 12 个月。<br>求 84 个月是多少年，用除法计算：<br><span class='text-amber-300 font-bold'>84 ÷ 12 = 7 年</span>。<br>所以正确答案是 <b>A. 7 年</b>。"
                },
                {
                    id: 2,
                    num: "问题 2",
                    question: "56 秒 + [  ] + 34 秒 = 2 分钟",
                    options: ["A. 20 秒", "B. 25 秒", "C. 30 秒", "D. 35 秒"],
                    answer: 2,
                    explanation: "💡 <b>计算步骤：</b><br>首先把单位统一：2 分钟 = 120 秒。<br>已知时间加和：56 秒 + 34 秒 = 90 秒。<br>计算括号里的数：<br><span class='text-amber-300 font-bold'>120 秒 - 90 秒 = 30 秒</span>。<br>所以正确答案是 <b>C. 30 秒</b>。"
                },
                {
                    id: 3,
                    num: "问题 3",
                    question: "7 分钟 44 秒 ÷ 8 =",
                    options: ["A. 93 分钟", "B. 58 分钟", "C. 93 秒", "D. 58 秒"],
                    answer: 3,
                    explanation: "💡 <b>计算步骤：</b><br>先把 7 分钟 44 秒换算成秒：<br>7 分钟 = 7 × 60 秒 = 420 秒<br>420 秒 + 44 秒 = 464 秒。<br>接着除以 8：<br><span class='text-amber-300 font-bold'>464 秒 ÷ 8 = 58 秒</span>。<br>所以正确答案是 <b>D. 58 秒</b>。"
                },
                {
                    id: 4,
                    num: "问题 4",
                    question: "哪项说明是不正确的？",
                    options: [
                        "A. 一年有 12 个月",
                        "B. 一年里，2 月的天数最多",
                        "C. 一年的第一天是 1 月 1 日",
                        "D. 母亲节是 5 月的第二个星期日"
                    ],
                    answer: 1,
                    explanation: "💡 <b>分析说明：</b><br>选项 B 说法错误。一年里，2 月的天数是最少的（平年 28 天，闰年 29 天），而不是最多！<br>大月有 31 天（1、3、5、7、8、10、12月）。<br>所以不正确的选项是 <b>B</b>。"
                },
                {
                    id: 9,
                    num: "问题 5 (图表题)",
                    subTitle: "羽毛球比赛时间：男子单打 1小时48分 | 女子单打 1小时32分",
                    question: "两场单打比赛所用的时间相差多久？",
                    options: ["A. 16 分钟", "B. 18 分钟", "C. 29 分钟", "D. 31 分钟"],
                    answer: 0,
                    explanation: "💡 <b>计算步骤：</b><br>男子单打 = 1 小时 48 分钟<br>女子单打 = 1 小时 32 分钟<br>求相差多久用减法：<br><span class='text-amber-300 font-bold'>1 小时 48 分 - 1 小时 32 分 = 16 分钟</span>。<br>所以正确答案是 <b>A. 16 分钟</b>。"
                }
            ],
            level2: [
                {
                    id: 5,
                    num: "问题 6 (挑战)",
                    question: "快递公司的员工用 42 分钟 5 秒处理了 5 个包裹。处理每个包裹平均用了多少时间？",
                    options: ["A. 8 分钟 15 秒", "B. 8 分钟 25 秒", "C. 9 分钟 15 秒", "D. 9 分钟 25 秒"],
                    answer: 1,
                    explanation: "💡 <b>计算步骤：</b><br>用总时间除以包裹数量：42 分钟 5 秒 ÷ 5。<br>1. 42 分钟 ÷ 5 = 8 分钟，余 2 分钟。<br>2. 余下的 2 分钟换算成秒：2 × 60 = 120 秒。<br>3. 加上原本的 5 秒：120 秒 + 5 秒 = 125 秒。<br>4. 125 秒 ÷ 5 = 25 秒。<br>合起来是：<span class='text-amber-300 font-bold'>8 分钟 25 秒</span>。<br>所以正确答案是 <b>B</b>。"
                },
                {
                    id: 6,
                    num: "问题 7 (时刻推理)",
                    question: "伟信 1:30 吃午餐。20 分钟后开始做功课，用了 2 小时 45 分钟完成。他在什么时刻完成功课？",
                    options: ["A. 上午 4:15", "B. 上午 4:35", "C. 下午 4:15", "D. 下午 4:35"],
                    answer: 3,
                    explanation: "💡 <b>计算步骤：</b><br>1. 吃午餐时刻：下午 1:30。<br>2. 20 分钟后开始做功课：1:30 + 20 分钟 = 下午 1:50。<br>3. 加上做功课时间 2 小时 45 分钟：<br>&nbsp;&nbsp; 1:50 + 2 小时 = 下午 3:50。<br>&nbsp;&nbsp; 3:50 + 45 分钟 = 下午 4:35 (因为50分+45分=95分=1小时35分)。<br>所以正确答案是 <span class='text-amber-300 font-bold'>D. 下午 4:35</span>。"
                },
                {
                    id: 7,
                    num: "问题 8 (除法换算)",
                    question: "慕洁在景阳茶室工作 6 天，共工作 45 个小时。她平均每天工作多少时间？",
                    options: ["A. 6 小时 30 分钟", "B. 7 小时 30 分钟", "C. 8 小时 30 分钟", "D. 9 小时 30 分钟"],
                    answer: 1,
                    explanation: "💡 <b>计算步骤：</b><br>计算 45 小时 ÷ 6：<br>1. 45 ÷ 6 = 7 小时，余 3 小时。<br>2. 3 小时换算成分钟：3 × 60 = 180 分钟。<br>3. 180 分钟 ÷ 6 = 30 分钟。<br>合起来是：<span class='text-amber-300 font-bold'>7 小时 30 分钟</span>。<br>所以正确答案是 <b>B</b>。"
                },
                {
                    id: 8,
                    num: "问题 9 (应用理解)",
                    question: "咏棋编制一个竹篮需要 25 分钟。她要编制给 3 名弟妹和自己各一个竹篮，共需要多少时间？",
                    options: ["A. 1 小时 20 分钟", "B. 1 小时 30 分钟", "C. 1 小时 40 分钟", "D. 1 小时 50 分钟"],
                    answer: 2,
                    explanation: "💡 <b>计算步骤：</b><br>1. 明确竹篮总数：“3名弟妹 + 自己”一共是 <span class='text-amber-300 font-bold'>4 个人</span>，需要 4 个竹篮。<br>2. 计算总时间：25 分钟 × 4 = 100 分钟。<br>3. 把 100 分钟化成小时和分钟：<br>&nbsp;&nbsp; 100 ÷ 60 = 1 小时，余 40 分钟。<br>所以共需要 <span class='text-amber-300 font-bold'>1 小时 40 分钟</span>，正确答案是 <b>C</b>。"
                },
                {
                    id: 10,
                    num: "问题 10 (图表综合)",
                    subTitle: "羽毛球比赛时间：男子双打 1小时55分 | 女子双打 1小时5分",
                    question: "两场双打比赛共用了多少时间？",
                    options: ["A. 2 小时 2 分钟", "B. 3 小时", "C. 3 小时 4 分钟", "D. 3 小时 6 分钟"],
                    answer: 1,
                    explanation: "💡 <b>计算步骤：</b><br>男子双打 = 1 小时 55 分钟<br>女子双打 = 1 小时 5 分钟<br>计算总时间（加法）：<br>1 小时 + 1 小时 = 2 小时<br>55 分钟 + 5 分钟 = 60 分钟 = 1 小时<br>2 小时 + 1 小时 = <span class='text-amber-300 font-bold'>3 小时</span>。<br>所以正确答案是 <b>B. 3 小时</b>。"
                }
            ]
        };

        let currentLevelKey = 'level1';
        let currentQuestionIdx = 0;
        let score = 0;
        let combo = 0;
        let totalAnswered = 0;
        let correctCount = 0;
        let soundEnabled = true;

        // Audio synthesizer using Web Audio API
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3); // A5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.4); // A2
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    noteGain.gain.setValueAtTime(0.2, now + idx * 0.12);
                    noteGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.25);
                    noteOsc.start(now + idx * 0.12);
                    noteOsc.stop(now + idx * 0.12 + 0.25);
                });
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = "fa-solid fa-volume-high";
            } else {
                icon.className = "fa-solid fa-volume-xmark text-red-400";
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Target virtual dimensions
        const V_WIDTH = 800;
        const V_HEIGHT = 600;

        let optionBoxes = [];
        let particles = [];
        let timeGears = [];
        let feedbackAnimation = null; // { text, color, alpha, y, scale }

        // Setup background decorative gears
        for (let i = 0; i < 6; i++) {
            timeGears.push({
                x: Math.random() * V_WIDTH,
                y: Math.random() * V_HEIGHT,
                radius: 20 + Math.random() * 40,
                angle: Math.random() * Math.PI * 2,
                speed: (Math.random() - 0.5) * 0.02
            });
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);

        // Cat Character mascot
        function drawMascot(x, y, state = 'happy') {
            ctx.save();
            ctx.translate(x, y);

            // Floating oscillation
            const floatY = Math.sin(Date.now() * 0.003) * 6;
            ctx.translate(0, floatY);

            // Tail
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-15, 10);
            ctx.quadraticCurveTo(-35, 20 + Math.sin(Date.now() * 0.005) * 10, -30, -5);
            ctx.stroke();

            // Body
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.ellipse(0, 15, 22, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.arc(0, -10, 25, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            ctx.fillStyle = '#f59e0b';
            // Left Ear
            ctx.beginPath();
            ctx.moveTo(-20, -22);
            ctx.lineTo(-30, -42);
            ctx.lineTo(-8, -30);
            ctx.fill();
            // Right Ear
            ctx.beginPath();
            ctx.moveTo(20, -22);
            ctx.lineTo(30, -42);
            ctx.lineTo(8, -30);
            ctx.fill();

            // Inner ears
            ctx.fillStyle = '#f472b6';
            ctx.beginPath();
            ctx.moveTo(-18, -24);
            ctx.lineTo(-25, -37);
            ctx.lineTo(-10, -30);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(18, -24);
            ctx.lineTo(25, -37);
            ctx.lineTo(10, -30);
            ctx.fill();

            // Wizard Hat
            ctx.fillStyle = '#6366f1';
            ctx.beginPath();
            ctx.moveTo(-28, -28);
            ctx.lineTo(0, -65);
            ctx.lineTo(28, -28);
            ctx.closePath();
            ctx.fill();
            // Hat star
            ctx.fillStyle = '#fef08a';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('★', 0, -42);

            // Eyes
            ctx.fillStyle = '#1e1b4b';
            if (state === 'happy') {
                ctx.beginPath();
                ctx.arc(-8, -12, 3.5, 0, Math.PI * 2);
                ctx.arc(8, -12, 3.5, 0, Math.PI * 2);
                ctx.fill();
                // Eye highlights
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-9, -14, 1.2, 0, Math.PI * 2);
                ctx.arc(7, -14, 1.2, 0, Math.PI * 2);
                ctx.fill();
            } else if (state === 'wrong') {
                // > < eyes
                ctx.strokeStyle = '#1e1b4b';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-12, -15); ctx.lineTo(-5, -10); ctx.lineTo(-12, -5);
                ctx.moveTo(12, -15); ctx.lineTo(5, -10); ctx.lineTo(12, -5);
                ctx.stroke();
            }

            // Snout & Cheeks
            ctx.fillStyle = '#fbcfe8';
            ctx.beginPath();
            ctx.arc(-14, -6, 4, 0, Math.PI * 2);
            ctx.arc(14, -6, 4, 0, Math.PI * 2);
            ctx.fill();

            // Mouth
            ctx.strokeStyle = '#1e1b4b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -4, 4, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();

            // Little Clock badge on chest
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 15, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // Clock hands
            ctx.beginPath();
            ctx.moveTo(0, 15); ctx.lineTo(0, 10);
            ctx.moveTo(0, 15); ctx.lineTo(4, 15);
            ctx.stroke();

            ctx.restore();
        }

        // Draw gear
        function drawGear(x, y, radius, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 2;

            const teeth = 8;
            ctx.beginPath();
            for (let i = 0; i < teeth; i++) {
                const a1 = (i / teeth) * Math.PI * 2;
                const a2 = a1 + (Math.PI / teeth) * 0.5;
                const a3 = a1 + (Math.PI / teeth);

                const r1 = radius;
                const r2 = radius + 6;

                ctx.lineTo(Math.cos(a1) * r1, Math.sin(a1) * r1);
                ctx.lineTo(Math.cos(a1) * r2, Math.sin(a1) * r2);
                ctx.lineTo(Math.cos(a2) * r2, Math.sin(a2) * r2);
                ctx.lineTo(Math.cos(a3) * r1, Math.sin(a3) * r1);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Inner hole
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function render() {
            const scaleX = canvas.width / V_WIDTH;
            const scaleY = canvas.height / V_HEIGHT;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background Gradient
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#1e1b4b');
            bgGradient.addColorStop(1, '#312e81');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.scale(scaleX, scaleY);

            // Draw floating animated background gears
            timeGears.forEach(gear => {
                gear.angle += gear.speed;
                drawGear(gear.x, gear.y, gear.radius, gear.angle);
            });

            // Get current question safely
            const qList = questionBank[currentLevelKey] || [];
            const safeIdx = Math.min(Math.max(0, currentQuestionIdx), qList.length - 1);
            const currentQ = qList[safeIdx];

            if (currentQ) {
                // Render Mascot
                drawMascot(100, 100, feedbackAnimation ? (feedbackAnimation.isCorrect ? 'happy' : 'wrong') : 'happy');

                // Question Board Box
                ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                ctx.strokeStyle = 'rgba(129, 140, 248, 0.4)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(180, 25, 595, 150, 16);
                ctx.fill();
                ctx.stroke();

                // Question Header Badge
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.roundRect(200, 38, 120, 30, 10);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px "Noto Sans SC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(currentQ.num, 260, 59);

                // Progress text (e.g., 1 / 5)
                ctx.fillStyle = '#93c5fd';
                ctx.font = 'bold 14px "Noto Sans SC", sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(`进度: ${Math.min(currentQuestionIdx + 1, qList.length)} / ${qList.length}`, 755, 58);

                // Question Text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px "Noto Sans SC", sans-serif';
                ctx.textAlign = 'left';

                if (currentQ.subTitle) {
                    // Draw subtitle if table info exists
                    ctx.fillStyle = '#67e8f9';
                    ctx.font = 'bold 14px "Noto Sans SC", sans-serif';
                    ctx.fillText(currentQ.subTitle, 200, 92);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 19px "Noto Sans SC", sans-serif';
                    ctx.fillText(currentQ.question, 200, 128);
                } else {
                    // Standard question text wrapping support if long
                    wrapText(ctx, currentQ.question, 200, 102, 550, 28);
                }

                // Render 4 Options
                optionBoxes = [];
                const startY = 195;
                const cardHeight = 72;
                const spacing = 14;

                currentQ.options.forEach((optText, idx) => {
                    const boxY = startY + idx * (cardHeight + spacing);
                    const boxX = 180;
                    const boxW = 595;

                    // Save box area for click detection
                    optionBoxes.push({
                        index: idx,
                        x: boxX,
                        y: boxY,
                        w: boxW,
                        h: cardHeight,
                        text: optText
                    });

                    // Glass gradient option background
                    const optGrad = ctx.createLinearGradient(boxX, boxY, boxX + boxW, boxY);
                    optGrad.addColorStop(0, 'rgba(30, 41, 59, 0.85)');
                    optGrad.addColorStop(1, 'rgba(51, 65, 85, 0.85)');

                    ctx.fillStyle = optGrad;
                    ctx.strokeStyle = 'rgba(165, 180, 252, 0.3)';
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    ctx.roundRect(boxX, boxY, boxW, cardHeight, 14);
                    ctx.fill();
                    ctx.stroke();

                    // Decorative option indicator circle
                    ctx.fillStyle = '#4f46e5';
                    ctx.beginPath();
                    ctx.arc(boxX + 35, boxY + cardHeight / 2, 18, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fef08a';
                    ctx.font = 'bold 16px "Noto Sans SC", sans-serif';
                    ctx.textAlign = 'center';
                    const letter = String.fromCharCode(65 + idx); // A, B, C, D
                    ctx.fillText(letter, boxX + 35, boxY + cardHeight / 2 + 5);

                    // Option content text
                    ctx.fillStyle = '#f8fafc';
                    ctx.font = 'bold 18px "Noto Sans SC", sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(optText, boxX + 70, boxY + cardHeight / 2 + 6);
                });
            }

            // Draw particles (sparkles)
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.alpha <= 0) particles.splice(idx, 1);
            });

            // Draw Feedback Pop Animation
            if (feedbackAnimation) {
                ctx.save();
                ctx.translate(480, 300);
                ctx.scale(feedbackAnimation.scale, feedbackAnimation.scale);

                ctx.fillStyle = feedbackAnimation.color;
                ctx.font = 'black 46px "Noto Sans SC", sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.fillText(feedbackAnimation.text, 0, feedbackAnimation.y);

                ctx.restore();

                feedbackAnimation.scale += (1 - feedbackAnimation.scale) * 0.15;
                feedbackAnimation.y -= 0.5;
                feedbackAnimation.alpha -= 0.015;

                if (feedbackAnimation.alpha <= 0) {
                    feedbackAnimation = null;
                }
            }

            // Draw Hint Helper button inside Canvas
            ctx.fillStyle = 'rgba(217, 119, 6, 0.85)';
            ctx.beginPath();
            ctx.roundRect(25, 200, 130, 42, 12);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px "Noto Sans SC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('💡 查看解题提示', 90, 226);

            ctx.restore();

            requestAnimationFrame(render);
        }

        // Text wrapping helper for Canvas
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split('');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n];
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function triggerParticles(x, y, color) {
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: 3 + Math.random() * 5,
                    color: color,
                    alpha: 1.0
                });
            }
        }

        function handleCanvasClick(e) {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Map click to virtual resolution 800x600
            const vX = (clickX / canvas.width) * V_WIDTH;
            const vY = (clickY / canvas.height) * V_HEIGHT;

            // Check if "Hint" button was clicked
            if (vX >= 25 && vX <= 155 && vY >= 200 && vY <= 242) {
                showExplanationModal();
                return;
            }

            // Check option box clicks
            const qList = questionBank[currentLevelKey] || [];
            if (currentQuestionIdx >= qList.length) return;
            const currentQ = qList[currentQuestionIdx];
            if (!currentQ) return;

            optionBoxes.forEach(box => {
                if (vX >= box.x && vX <= box.x + box.w && vY >= box.y && vY <= box.y + box.h) {
                    checkAnswer(box.index, currentQ, box.x + box.w / 2, box.y + box.h / 2);
                }
            });
        }

        canvas.addEventListener('click', handleCanvasClick);

        function checkAnswer(selectedIndex, questionObj, clickVx, clickVy) {
            totalAnswered++;

            if (selectedIndex === questionObj.answer) {
                // Correct Answer
                correctCount++;
                combo++;
                const comboBonus = combo * 20;
                const earnedScore = 100 + comboBonus;
                score += earnedScore;

                playSound('correct');
                triggerParticles(clickVx, clickVy, '#34d399');

                feedbackAnimation = {
                    text: combo > 1 ? `答对了! ${combo}连击! +${earnedScore}` : `回答正确! +${earnedScore}`,
                    color: '#34d399',
                    alpha: 1.0,
                    y: 0,
                    scale: 0.2,
                    isCorrect: true
                };

                updateHeaderStats();

                // Delay to next question
                setTimeout(() => {
                    nextQuestion();
                }, 1100);

            } else {
                // Incorrect Answer
                combo = 0;
                playSound('wrong');
                triggerParticles(clickVx, clickVy, '#f87171');

                feedbackAnimation = {
                    text: '再试一次哦！',
                    color: '#f87171',
                    alpha: 1.0,
                    y: 0,
                    scale: 0.2,
                    isCorrect: false
                };

                updateHeaderStats();

                // Automatically pop hint after wrong answer
                setTimeout(() => {
                    showExplanationModal();
                }, 800);
            }
        }

        function updateHeaderStats() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('comboDisplay').innerText = `${combo} x`;
        }

        function nextQuestion() {
            const qList = questionBank[currentLevelKey];
            currentQuestionIdx++;

            if (currentQuestionIdx >= qList.length) {
                // Level Completed!
                showWinModal();
            }
        }

        function showExplanationModal() {
            const qList = questionBank[currentLevelKey] || [];
            const safeIdx = Math.min(Math.max(0, currentQuestionIdx), qList.length - 1);
            const currentQ = qList[safeIdx];
            if (!currentQ) return;

            document.getElementById('modalTitle').innerText = `${currentQ.num} 解题提示与步骤`;
            document.getElementById('modalBody').innerHTML = `
                <div class="bg-indigo-950/60 p-3 rounded-xl border border-indigo-700/40 mb-3 text-amber-200 font-bold">
                    ${currentQ.question}
                </div>
                <div>${currentQ.explanation}</div>
            `;
            document.getElementById('explanationModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('explanationModal').classList.add('hidden');
        }

        function showWinModal() {
            playSound('win');
            const winModal = document.getElementById('winModal');
            const accuracy = Math.round((correctCount / Math.max(1, totalAnswered)) * 100);

            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalAccuracy').innerText = `${accuracy}%`;

            if (currentLevelKey === 'level1') {
                document.getElementById('winTitle').innerText = '🎉 第一关顺利通关！';
                document.getElementById('winMessage').innerText = '你非常熟练地掌握了时间基础运算！准备好挑战高难度的第二关了吗？';
                document.getElementById('nextLevelBtn').classList.remove('hidden');
            } else {
                document.getElementById('winTitle').innerText = '👑 恭喜获得时空大大师称号！';
                document.getElementById('winMessage').innerText = '太厉害了！你成功破解了所有高难度的三年级时间数学应用题！';
                document.getElementById('nextLevelBtn').classList.add('hidden');
            }

            winModal.classList.remove('hidden');
        }

        function startNextLevel() {
            currentLevelKey = 'level2';
            currentQuestionIdx = 0;
            document.getElementById('levelDisplay').innerText = '第二关 (进阶挑战)';
            document.getElementById('levelDisplay').className = 'text-pink-400 font-black';
            document.getElementById('winModal').classList.add('hidden');
        }

        function restartCurrentLevel() {
            currentQuestionIdx = 0;
            score = 0;
            combo = 0;
            totalAnswered = 0;
            correctCount = 0;
            updateHeaderStats();
            document.getElementById('winModal').classList.add('hidden');
        }

        /* Scratchpad Canvas functionality */
        const scratchCanvas = document.getElementById('scratchCanvas');
        const scratchCtx = scratchCanvas.getContext('2d');
        let isScratching = false;
        let scratchColor = '#ef4444';

        function toggleScratchpad() {
            const sc = document.getElementById('scratchCanvas');
            const controls = document.getElementById('scratchControls');
            if (sc.classList.contains('hidden')) {
                sc.width = canvas.width;
                sc.height = canvas.height;
                sc.classList.remove('hidden');
                controls.classList.remove('hidden');
            } else {
                sc.classList.add('hidden');
                controls.classList.add('hidden');
            }
        }

        function setScratchColor(color) {
            scratchColor = color;
        }

        function clearScratchpad() {
            scratchCtx.clearRect(0, 0, scratchCanvas.width, scratchCanvas.height);
        }

        scratchCanvas.addEventListener('pointerdown', (e) => {
            isScratching = true;
            const rect = scratchCanvas.getBoundingClientRect();
            scratchCtx.beginPath();
            scratchCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            scratchCtx.strokeStyle = scratchColor;
            scratchCtx.lineWidth = 4;
            scratchCtx.lineCap = 'round';
        });

        scratchCanvas.addEventListener('pointermove', (e) => {
            if (!isScratching) return;
            const rect = scratchCanvas.getBoundingClientRect();
            scratchCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            scratchCtx.stroke();
        });

        scratchCanvas.addEventListener('pointerup', () => isScratching = false);

        window.onload = function() {
            resizeCanvas();
            render();
        };
    </script>
</body>
</html>
