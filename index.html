<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>时空萌宠大冒险 - 三年级时间单位换算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            touch-action: none;
            user-select: none;
            background: linear-gradient(135deg, #fef3c7 0%, #e0e7ff 100%);
        }
        .font-game { font-family: 'Fredoka One', cursive; }

        .drop-target {
            transition: all 0.2s ease;
        }
        .drop-target.drag-over {
            transform: scale(1.05);
            border-color: #f59e0b !important;
            background-color: #fef3c7 !important;
        }

        .drag-card {
            touch-action: none;
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .drag-card:active {
            cursor: grabbing;
        }
        .drag-card.dragging {
            opacity: 0.8;
            transform: scale(1.1) rotate(3deg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            z-index: 50;
        }

        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-short {
            animation: bounce-short 0.4s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 md:p-4 text-slate-800 select-none">

    <!-- 主面板 -->
    <div class="relative w-full max-w-4xl bg-white/90 backdrop-blur-md border-4 border-amber-300 rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-[620px]">
        
        <!-- 顶部信息栏 -->
        <div class="bg-amber-100/80 border-b-2 border-amber-200 p-3 md:p-4 flex justify-between items-center z-10">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-400 text-amber-950 px-3 py-1.5 rounded-2xl text-xs md:text-sm font-black flex items-center gap-2 shadow-sm">
                    <i class="fas fa-paw"></i>
                    <span id="levelText">第一关：萌宠初体验</span>
                </div>
                <div class="text-rose-500 font-game text-base md:text-lg flex items-center gap-1">
                    <i class="fas fa-star text-amber-400"></i>
                    <span>得分: <span id="scoreText">0</span></span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="scratchBtn" class="bg-emerald-400 hover:bg-emerald-500 text-emerald-950 px-3 py-1.5 rounded-xl text-xs md:text-sm font-bold transition flex items-center gap-1 shadow-md active:scale-95">
                    <i class="fas fa-pen-fancy"></i> 草稿纸
                </button>
                <button id="hintBtn" class="bg-sky-400 hover:bg-sky-500 text-sky-950 px-3 py-1.5 rounded-xl text-xs md:text-sm font-bold transition flex items-center gap-1 shadow-md active:scale-95">
                    <i class="fas fa-lightbulb"></i> 提示
                </button>
            </div>
        </div>

        <!-- Canvas 背景特效层 -->
        <canvas id="bgCanvas" class="absolute inset-0 pointer-events-none z-0"></canvas>

        <!-- 拖拽游戏核心区域 -->
        <div class="relative flex-1 p-4 md:p-6 flex flex-col justify-between z-10">
            
            <!-- 引导语 -->
            <div class="text-center mb-2">
                <p class="text-slate-600 font-bold text-sm md:text-base">拖动底部的【粉色糖果卡片】放进正确的【蓝色算式框】里吧！</p>
            </div>

            <!-- 拖放目标区 (配对框) -->
            <div id="targetContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 my-auto">
                <!-- 动态生成配对框 -->
            </div>

            <!-- 可拖拽卡片池 -->
            <div class="mt-4 pt-3 border-t-2 border-dashed border-amber-200">
                <div class="text-xs font-bold text-amber-600 mb-2 text-center"><i class="fas fa-hand-pointer mr-1"></i>按住拖动卡片：</div>
                <div id="sourceContainer" class="flex flex-wrap justify-center gap-2 md:gap-3 min-h-[60px]">
                    <!-- 动态生成待拖拽卡片 -->
                </div>
            </div>
        </div>

        <!-- 内置草稿纸浮层 -->
        <div id="scratchpadModal" class="absolute inset-0 bg-white/95 backdrop-blur-md hidden flex-col z-30">
            <div class="p-3 bg-emerald-100 border-b border-emerald-200 flex justify-between items-center">
                <span class="font-bold text-emerald-800"><i class="fas fa-paint-brush mr-2"></i>可爱草稿纸 (任意演算)</span>
                <div class="flex gap-2">
                    <button id="clearScratch" class="bg-rose-400 hover:bg-rose-500 text-white px-3 py-1 rounded-lg text-xs font-bold">清空</button>
                    <button id="closeScratch" class="bg-slate-400 hover:bg-slate-500 text-white px-3 py-1 rounded-lg text-xs font-bold">关闭</button>
                </div>
            </div>
            <canvas id="scratchCanvas" class="flex-1 w-full h-full cursor-crosshair"></canvas>
        </div>
    </div>

    <!-- 弹窗：提示 -->
    <div id="hintModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white border-4 border-sky-300 rounded-3xl p-6 max-w-md w-full shadow-2xl text-center">
            <div class="text-4xl text-sky-400 mb-2"><i class="fas fa-lightbulb"></i></div>
            <h3 class="text-xl font-black text-slate-800 mb-2">换算小解题思路</h3>
            <p id="hintText" class="text-slate-600 text-sm md:text-base leading-relaxed mb-6 bg-sky-50 p-4 rounded-2xl border border-sky-100"></p>
            <button id="closeHint" class="w-full bg-sky-400 hover:bg-sky-500 text-white font-black py-3 rounded-2xl shadow-lg transition active:scale-95">我懂啦！</button>
        </div>
    </div>

    <!-- 弹窗：关卡结算 -->
    <div id="winModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white border-4 border-amber-400 rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl">
            <div class="text-6xl text-amber-400 mb-3 animate-bounce"><i class="fas fa-trophy"></i></div>
            <h2 id="winTitle" class="text-2xl md:text-3xl font-black text-slate-800 mb-2">🎉 第一关顺利通关！</h2>
            <p id="winDesc" class="text-slate-600 text-sm md:text-base mb-6">你太棒啦！基础换算完全难不倒你，准备好挑战更刺激的进阶换算了吗？</p>
            <button id="nextLevelBtn" class="w-full bg-gradient-to-r from-amber-400 to-rose-400 hover:from-amber-500 hover:to-rose-500 text-white font-black py-3.5 rounded-2xl shadow-lg transition transform active:scale-95 text-lg">
                开启下一关卡
            </button>
        </div>
    </div>

    <script>
        // 游戏题库数据（源自图片题目，改编为拖拽对）
        const gameData = {
            level1: [
                { id: "q1", prompt: "1 年 =", targetAns: "12 个月", hint: "基础知识：1 年包含 12 个月哦！" },
                { id: "q2", prompt: "1 个星期 =", targetAns: "7 天", hint: "基础知识：从星期一到星期日共 7 天。" },
                { id: "q3", prompt: "1 天 =", targetAns: "24 小时", hint: "基础知识：一天一夜一共有 24 小时。" },
                { id: "q4", prompt: "4 小时 =", targetAns: "240 分钟", hint: "计算：4 × 60 = 240 分钟。" }
            ],
            level2: [
                { id: "q5", prompt: "120 分钟 =", targetAns: "2 小时", hint: "计算：120 ÷ 60 = 2 小时。" },
                { id: "q6", prompt: "6 分钟 =", targetAns: "360 秒", hint: "计算：6 × 60 = 360 秒。" },
                { id: "q7", prompt: "1 小时 5 分钟 =", targetAns: "65 分钟", hint: "计算：60 分钟 + 5 分钟 = 65 分钟。" },
                { id: "q8", prompt: "200 秒 =", targetAns: "3 分 20 秒", hint: "计算：200 ÷ 60 = 3 分钟 余 20 秒。" }
            ]
        };

        let currentLevel = 'level1';
        let score = 0;
        let matchedCount = 0;
        let activeDragCard = null;
        let dragOffset = { x: 0, y: 0 };
        let originalPos = { x: 0, y: 0 };

        const targetContainer = document.getElementById('targetContainer');
        const sourceContainer = document.getElementById('sourceContainer');
        const levelText = document.getElementById('levelText');
        const scoreText = document.getElementById('scoreText');

        // 初始化关卡
        function initLevel(levelKey) {
            currentLevel = levelKey;
            matchedCount = 0;
            targetContainer.innerHTML = '';
            sourceContainer.innerHTML = '';
            levelText.innerText = levelKey === 'level1' ? '第一关：萌宠初体验' : '第二关：时空大挑战';

            const questions = gameData[levelKey];
            
            // 渲染目标配对框
            questions.forEach((q) => {
                const targetBox = document.createElement('div');
                targetBox.className = "drop-target bg-indigo-50/80 border-2 border-dashed border-indigo-300 rounded-2xl p-3 flex items-center justify-between min-h-[64px]";
                targetBox.dataset.ans = q.targetAns;
                targetBox.innerHTML = `
                    <span class="font-bold text-indigo-900 text-sm md:text-base ml-2">${q.prompt}</span>
                    <div class="slot border-2 border-indigo-200 bg-white/60 rounded-xl w-32 md:w-36 h-10 flex items-center justify-center text-xs text-indigo-300 font-bold">
                        放入对应答案
                    </div>
                `;
                targetContainer.appendChild(targetBox);
            });

            // 打乱答案顺序生成拖拽卡片
            const shuffledAnswers = [...questions.map(q => q.targetAns)].sort(() => Math.random() - 0.5);

            shuffledAnswers.forEach((ansText) => {
                const card = document.createElement('div');
                card.className = "drag-card bg-gradient-to-r from-rose-400 to-pink-400 text-white font-black px-4 py-2 rounded-2xl shadow-md text-sm md:text-base border-2 border-white/50 active:scale-105 flex items-center gap-1.5 cursor-pointer";
                card.dataset.val = ansText;
                card.innerHTML = `<i class="fas fa-cookie-bite text-amber-200 text-xs"></i><span>${ansText}</span>`;
                
                // 绑定拖拽事件 (支持鼠标与触摸屏)
                bindDragEvents(card);
                sourceContainer.appendChild(card);
            });
        }

        // 绑定全端通用拖拽事件
        function bindDragEvents(card) {
            const onStart = (e) => {
                if (card.dataset.matched === "true") return;
                activeDragCard = card;

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                const rect = card.getBoundingClientRect();
                dragOffset.x = clientX - rect.left;
                dragOffset.y = clientY - rect.top;

                originalPos.x = rect.left;
                originalPos.y = rect.top;

                card.classList.add('dragging');
                card.style.position = 'fixed';
                card.style.left = `${rect.left}px`;
                card.style.top = `${rect.top}px`;
                card.style.width = `${rect.width}px`;
            };

            card.addEventListener('mousedown', onStart);
            card.addEventListener('touchstart', onStart, { passive: false });
        }

        const onMove = (e) => {
            if (!activeDragCard) return;
            if (e.cancelable) e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            activeDragCard.style.left = `${clientX - dragOffset.x}px`;
            activeDragCard.style.top = `${clientY - dragOffset.y}px`;

            // 高亮目标框
            checkHoverTargets(clientX, clientY);
        };

        const onEnd = (e) => {
            if (!activeDragCard) return;

            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

            const droppedTarget = getHoverTarget(clientX, clientY);

            if (droppedTarget && droppedTarget.dataset.ans === activeDragCard.dataset.val) {
                // 匹配正确
                handleMatchSuccess(activeDragCard, droppedTarget);
            } else {
                // 匹配错误/放回原位
                handleMatchFail(activeDragCard);
            }

            clearHoverTargets();
            activeDragCard = null;
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchend', onEnd);

        // 检测悬停框
        function getHoverTarget(x, y) {
            const targets = document.querySelectorAll('.drop-target');
            for (let t of targets) {
                const rect = t.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    return t;
                }
            }
            return null;
        }

        function checkHoverTargets(x, y) {
            document.querySelectorAll('.drop-target').forEach(t => {
                const rect = t.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    t.classList.add('drag-over');
                } else {
                    t.classList.remove('drag-over');
                }
            });
        }

        function clearHoverTargets() {
            document.querySelectorAll('.drop-target').forEach(t => t.classList.remove('drag-over'));
        }

        // 处理匹配成功
        function handleMatchSuccess(card, target) {
            card.dataset.matched = "true";
            card.classList.remove('dragging');
            card.style.position = 'static';
            card.style.width = 'auto';
            card.className = "bg-emerald-500 text-white font-black px-3 py-1.5 rounded-xl text-sm shadow-sm flex items-center gap-1 animate-bounce-short";

            const slot = target.querySelector('.slot');
            slot.innerHTML = '';
            slot.appendChild(card);
            slot.className = "rounded-xl flex items-center justify-center";

            target.className = "drop-target bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-3 flex items-center justify-between min-h-[64px]";

            score += 25;
            scoreText.innerText = score;
            matchedCount++;

            createParticles(target.getBoundingClientRect().left + 50, target.getBoundingClientRect().top + 20);

            if (matchedCount >= gameData[currentLevel].length) {
                setTimeout(showWinModal, 600);
            }
        }

        // 处理匹配失败 (回弹)
        function handleMatchFail(card) {
            card.classList.remove('dragging');
            card.style.position = 'static';
            card.style.width = 'auto';
            sourceContainer.appendChild(card);
        }

        // 结算弹窗
        function showWinModal() {
            const winModal = document.getElementById('winModal');
            const winTitle = document.getElementById('winTitle');
            const winDesc = document.getElementById('winDesc');
            const nextBtn = document.getElementById('nextLevelBtn');

            if (currentLevel === 'level1') {
                winTitle.innerText = "🎉 第一关顺利通关！";
                winDesc.innerText = "你太棒了！基础单位换算完全难不倒你，准备好挑战更刺激的第二关了吗？";
                nextBtn.innerText = "开启第二关";
                nextBtn.onclick = () => {
                    winModal.classList.add('hidden');
                    initLevel('level2');
                };
            } else {
                winTitle.innerText = "🏆 获得【换算小达人】勋章！";
                winDesc.innerText = `太厉害啦！你完成了所有练习，最终得分：${score} 分！`;
                nextBtn.innerText = "再玩一次";
                nextBtn.onclick = () => {
                    score = 0;
                    scoreText.innerText = score;
                    winModal.classList.add('hidden');
                    initLevel('level1');
                };
            }
            winModal.classList.remove('hidden');
        }

        // 提示弹窗
        document.getElementById('hintBtn').onclick = () => {
            const hints = gameData[currentLevel].map(q => `• ${q.prompt} 👉 ${q.hint}`).join('<br><br>');
            document.getElementById('hintText').innerHTML = hints;
            document.getElementById('hintModal').classList.remove('hidden');
        };
        document.getElementById('closeHint').onclick = () => {
            document.getElementById('hintModal').classList.add('hidden');
        };

        // Canvas 简易粒子星光背景
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticles(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    color: `hsl(${Math.random() * 50 + 30}, 100%, 60%)`,
                    size: Math.random() * 6 + 2,
                    alpha: 1
                });
            }
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        // 草稿纸功能
        const scratchModal = document.getElementById('scratchpadModal');
        const scratchCanvas = document.getElementById('scratchCanvas');
        const scratchCtx = scratchCanvas.getContext('2d');
        let isDrawing = false;

        document.getElementById('scratchBtn').onclick = () => {
            scratchModal.classList.remove('hidden');
            scratchCanvas.width = scratchModal.clientWidth;
            scratchCanvas.height = scratchModal.clientHeight;
        };
        document.getElementById('closeScratch').onclick = () => scratchModal.classList.add('hidden');
        document.getElementById('clearScratch').onclick = () => scratchCtx.clearRect(0, 0, scratchCanvas.width, scratchCanvas.height);

        function draw(e) {
            if (!isDrawing) return;
            const rect = scratchCanvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

            scratchCtx.lineWidth = 3;
            scratchCtx.lineCap = 'round';
            scratchCtx.strokeStyle = '#059669';

            scratchCtx.lineTo(x, y);
            scratchCtx.stroke();
            scratchCtx.beginPath();
            scratchCtx.moveTo(x, y);
        }

        scratchCanvas.addEventListener('mousedown', (e) => { isDrawing = true; draw(e); });
        scratchCanvas.addEventListener('mouseup', () => { isDrawing = false; scratchCtx.beginPath(); });
        scratchCanvas.addEventListener('mousemove', draw);
        scratchCanvas.addEventListener('touchstart', (e) => { isDrawing = true; draw(e); });
        scratchCanvas.addEventListener('touchend', () => { isDrawing = false; scratchCtx.beginPath(); });
        scratchCanvas.addEventListener('touchmove', draw);

        // 启动游戏
        initLevel('level1');
    </script>
</body>
</html>
