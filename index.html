<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>度量衡大冒险 ⚖️🧪</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: #333;
        }
        .game-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        .progress-bar {
            background: #eee;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress {
            background: #4CAF50;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .question-box {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 20px 0;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #6e8efb;
        }
        input[type="number"] {
            width: 80px;
            padding: 8px;
            font-size: 1.1rem;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin: 0 5px;
        }
        button {
            background: #6e8efb;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 15px;
        }
        button:hover {
            background: #5a7bef;
            transform: scale(1.05);
        }
        .feedback {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            height: 30px;
        }
        .score-board {
            font-size: 1.5rem;
            color: #ff9800;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div id="start-screen">
        <h1>⚖️ 度量衡大冒险 🧪</h1>
        <p>准备好挑战两张工作表里的 18 道难题了吗？</p>
        <p>目标分数：<b>100 分</b> 🌟</p>
        <button onclick="startGame()">开始挑战 🚀</button>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="progress-bar"><div class="progress" id="progress"></div></div>
        <div style="display: flex; justify-content: space-between; font-weight: bold;">
            <span id="q-num">第 1/18 题</span>
            <span class="score-board">得分: <span id="score">0</span></span>
        </div>
        
        <div class="question-box" id="question">题目加载中...</div>
        <div id="input-area"></div>
        
        <button onclick="submitAnswer()" id="submit-btn">提交答案 ✏️</button>
        <div class="feedback" id="feedback"></div>
    </div>

    <div id="end-screen" style="display: none;">
        <h1>🎉 挑战完成！</h1>
        <p>你的最终得分是：</p>
        <div class="score-board" style="font-size: 3rem;" id="final-score">0 / 100</div>
        <p id="evaluation"></p>
        <button onclick="location.reload()">再玩一次 🔄</button>
    </div>
</div>

<script>
// 音效系统 (Web Audio API)
let audioCtx = null;

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

const Sound = {
    correct() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
    },
    wrong() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now); // A3
        osc.frequency.linearRampToValueAtTime(130, now + 0.2); // C3
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
    },
    win() {
        const ctx = getAudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
            const now = ctx.currentTime + idx * 0.1;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        });
    }
};

const questions = [
    // 质量换算 (图1 Section 六)
    { q: "7 kg = ____ g", inputs: 1, labels: ["g"], ans: [7000], pts: 5 },
    { q: "12 kg = ____ g", inputs: 1, labels: ["g"], ans: [12000], pts: 5 },
    { q: "10 000 g = ____ kg", inputs: 1, labels: ["kg"], ans: [10], pts: 5 },
    { q: "2 000 g = ____ kg", inputs: 1, labels: ["kg"], ans: [2], pts: 5 },
    { q: "8 kg 80 g = ____ g", inputs: 1, labels: ["g"], ans: [8080], pts: 5 },
    { q: "4 640 g = ____ kg ____ g", inputs: 2, labels: ["kg", "g"], ans: [4, 640], pts: 5 },
    
    // 质量加减法 (图1 Section 七 & 八)
    { q: "35 kg + 25 kg = ____ kg", inputs: 1, labels: ["kg"], ans: [60], pts: 5 },
    { q: "1 kg 80 g + 3 kg 560 g + 4 kg 725 g = ____ kg ____ g", inputs: 2, labels: ["kg", "g"], ans: [9, 365], pts: 6 },
    { q: "7 kg 85 g - 2 kg 500 g = ____ kg ____ g", inputs: 2, labels: ["kg", "g"], ans: [4, 585], pts: 6 },
    { q: "15 kg 780 g - 6 kg 420 g - 5 kg 300 g = ____ kg ____ g", inputs: 2, labels: ["kg", "g"], ans: [4, 60], pts: 6 },

    // 容量换算 (图2 Section G)
    { q: "8 升 = ____ 毫升", inputs: 1, labels: ["毫升"], ans: [8000], pts: 5 },
    { q: "4 000 毫升 = ____ 升", inputs: 1, labels: ["升"], ans: [4], pts: 5 },
    { q: "7 880 ml = ____ l ____ ml", inputs: 2, labels: ["l", "ml"], ans: [7, 880], pts: 5 },
    { q: "9 l 10 ml = ____ ml", inputs: 1, labels: ["ml"], ans: [9010], pts: 5 },

    // 容量加减法 (图2 Section H)
    { q: "6 升 28 毫升 + 3 升 72 毫升 = ____ 升 ____ 毫升", inputs: 2, labels: ["升", "毫升"], ans: [9, 100], pts: 6 },
    { q: "555 ml + 66 ml + 465 ml = ____ l ____ ml", inputs: 2, labels: ["l", "ml"], ans: [1, 86], pts: 6 },
    { q: "20 l 320 ml - 15 l 535 ml = ____ l ____ ml", inputs: 2, labels: ["l", "ml"], ans: [4, 785], pts: 6 },
    { q: "758 ml - [ ? ] ml - 28 ml = 425 ml<br>请算出 [ ? ] 里的数值：", inputs: 1, labels: ["ml"], ans: [305], pts: 7 }
];

let currentIndex = 0;
let score = 0;

function startGame() {
    getAudioContext(); // 初始化音频
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const q = questions[currentIndex];
    document.getElementById('q-num').innerText = `第 ${currentIndex + 1}/${questions.length} 题`;
    document.getElementById('progress').style.width = `${((currentIndex) / questions.length) * 100}%`;
    document.getElementById('question').innerHTML = q.q;
    document.getElementById('feedback').innerText = '';
    
    let inputHtml = '';
    for(let i = 0; i < q.inputs; i++) {
        inputHtml += `<input type="number" id="ans${i}"> ${q.labels[i]} `;
    }
    document.getElementById('input-area').innerHTML = inputHtml;
    document.getElementById('submit-btn').disabled = false;
}

function submitAnswer() {
    const q = questions[currentIndex];
    let correct = true;

    for(let i = 0; i < q.inputs; i++) {
        const userAns = parseInt(document.getElementById(`ans${i}`).value);
        if(userAns !== q.ans[i]) {
            correct = false;
            break;
        }
    }

    const feedbackEl = document.getElementById('feedback');
    document.getElementById('submit-btn').disabled = true;

    if(correct) {
        Sound.correct(); // 播放答对音效
        score += q.pts;
        document.getElementById('score').innerText = score;
        feedbackEl.style.color = '#4CAF50';
        feedbackEl.innerText = `✅ 太棒了！答对了 (+${q.pts}分)`;
    } else {
        Sound.wrong(); // 播放答错音效
        feedbackEl.style.color = '#f44336';
        feedbackEl.innerText = `❌ 答错了，正确答案是: ${q.ans.join(' , ')}`;
    }

    setTimeout(() => {
        currentIndex++;
        if(currentIndex < questions.length) {
            showQuestion();
        } else {
            endGame();
        }
    }, 1800);
}

function endGame() {
    Sound.win(); // 播放通关音效
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    document.getElementById('final-score').innerText = `${score} / 100`;

    let evalText = "";
    if(score === 100) evalText = "🏆 满分！你是当之无愧的度量衡大师！";
    else if(score >= 80) evalText = "🌟 非常优秀！再接再厉冲刺满分！";
    else evalText = "💪 还在努力中，多复习一下换算公式再来挑战吧！";
    
    document.getElementById('evaluation').innerText = evalText;
}
</script>

</body>
</html>
