<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东盟钱币大闯关</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }
        #game-box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 650px; 
            width: 100%; 
            text-align: center; 
            border: 4px solid #4a90e2; 
        }
        .hint { 
            color: #4a5568; 
            background: #ebf8ff; 
            padding: 15px; 
            border-radius: 10px; 
            border-left: 5px solid #3182ce; 
            text-align: left; 
            margin-bottom: 20px; 
            line-height: 1.6; 
        }
        .stats-bar { 
            display: flex; 
            justify-content: space-between; 
            background: #edf2f7; 
            padding: 12px 25px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            font-weight: bold; 
        }
        #quiz-container { display: none; margin: 20px 0; text-align: left; }
        .question-text { font-size: 1.2rem; font-weight: bold; color: #2d3748; margin-bottom: 20px; line-height: 1.5; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { 
            width: 100%; 
            padding: 15px 20px; 
            font-size: 1.05rem; 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            cursor: pointer; 
            text-align: left; 
            color: #4a5568; 
        }
        .option-btn:hover:not(:disabled) { background: #edf2f7; border-color: #cbd5e0; }
        .option-btn.correct { background: #c6f6d5 !important; border-color: #38a169 !important; color: #22543d !important; font-weight: bold; }
        .option-btn.incorrect { background: #fff5f5 !important; border-color: #e53e3e !important; color: #9b2c2c !important; }
        #msg { margin: 20px 0; font-size: 1.2rem; font-weight: bold; min-height: 35px; padding: 12px; border-radius: 8px; }
        .btn { 
            display: inline-block; 
            padding: 14px 45px; 
            background: #3182ce; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 1.2rem; 
            font-weight: bold; 
            box-shadow: 0 5px 15px rgba(49,130,206,0.4); 
            margin: 15px auto; 
        }
        .btn:hover { background: #2b6cb0; }
    </style>
</head>
<body>

<div id="game-box">
    <h2>🪙 三年级数学：东盟钱币知识大闯关</h2>
    <div id="hint-text" class="hint">欢迎来到全新的钱币大闯关！本测验包含 10 道精选单选题。请确保清除浏览器旧缓存后，点击下方蓝色按钮开启挑战！</div>
    
    <div>
        <button id="start-game-btn" class="btn" onclick="triggerStart()">开始游戏</button>
    </div>
    
    <div class="stats-bar">
        <div>⏱️ 用时: <span id="timer">0</span> 秒</div>
        <div>📋 进度: <span id="progress">0 / 10</span></div>
        <div>✨ 得分: <span id="score">0</span></div>
    </div>
    
    <div id="quiz-container">
        <div class="question-text" id="question-text">题目加载中...</div>
        <div class="options-list">
            <button class="option-btn" onclick="judgeAnswer(this)"></button>
            <button class="option-btn" onclick="judgeAnswer(this)"></button>
            <button class="option-btn" onclick="judgeAnswer(this)"></button>
            <button class="option-btn" onclick="judgeAnswer(this)"></button>
        </div>
    </div>

    <div id="msg">点击上方蓝色按钮启动游戏！</div>
    
    <div>
        <button id="next-q-btn" class="btn" style="display: none;" onclick="goNext()">下一题 ➡️</button>
    </div>
</div>

<script>
    const dataset = [
        { q: "在东南亚国家联盟（东盟）中，哪个国家使用的钱币单位是“铢”（Baht）？", options: ["越南", "菲律宾", "老挝"], ans: "泰国" },
        { q: "新加坡和文莱这两个东盟国家使用的钱币单位名称在课本中共同称为什么？", options: ["卢比", "令吉", "盾"], ans: "元" },
        { q: "如果你在印度尼西亚（Indonesia）旅游，你最可能使用哪种钱币单位？", options: ["基普", "比索", "瑞尔"], ans: "卢比" },
        { q: "钱币单位“盾”（Dong）属于以下哪个东盟国家？", options: ["柬埔寨", "文莱", "缅甸"], ans: "越南" },
        { q: "菲律宾（Philippines）使用的钱币单位名称是？", options: ["令吉", "铢", "瑞尔"], ans: "比索" },
        { q: "在数学课本第15页中，老挝（Laos）的钱币单位被标注为：", options: ["元", "瑞尔", "卢比"], ans: "基普" },
        { q: "哪一个国家的钱币单位是“瑞尔”（Riel）？", options: ["菲律宾", "缅甸", "泰国"], ans: "柬埔寨" },
        { q: "根据课本第16页的汇率表，缅甸（Myanmar）使用的钱币单位名称是？", options: ["铢", "令吉", "盾"], ans: "元" }, 
        { q: "马来西亚的法定钱币单位名称是？", options: ["铢", "比索", "元"], ans: "令吉" },
        { q: "关于不同国家的钱币，下列哪项说明符合课本第14页的内容？", options: ["东盟国家只使用纸币，不使用硬币。", "所有东盟国家的钱币单位名称都一样。", "1令吉的币值在任何时候都等于7.91铢。"], ans: "不同国家的钱币面额可能相同，但不一定等值。" }
    ];

    let activeIdx = 0, currentScore = 0, seconds = 0, clockId = null, pool = [], locked = false;

    function triggerStart() {
        activeIdx = 0; currentScore = 0; seconds = 0; locked = false;
        document.getElementById('start-game-btn').style.display = "none";
        document.getElementById('quiz-container').style.display = "block";
        document.getElementById('score').innerText = currentScore;
        document.getElementById('timer').innerText = seconds;
        
        clearInterval(clockId);
        clockId = setInterval(() => { seconds++; document.getElementById('timer').innerText = seconds; }, 1000);

        pool = [...dataset].sort(() => Math.random() - 0.5);
        renderQuiz();
    }

    function renderQuiz() {
        locked = false;
        document.getElementById('next-q-btn').style.display = "none";
        printLog("请读题并选择你认为正确的答案选项。", "transparent", "#2d3748");
        document.getElementById('progress').innerText = `${activeIdx + 1} / 10`;

        const targetData = pool[activeIdx];
        document.getElementById('question-text').innerText = `${activeIdx + 1}. ${targetData.q}`;

        let mixOptions = [targetData.ans, ...targetData.options].sort(() => Math.random() - 0.5);
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach((b, i) => {
            b.className = "option-btn";
            b.innerText = mixOptions[i];
            b.disabled = false;
        });
    }

    function judgeAnswer(element) {
        if (locked) return;
        locked = true;

        const targetData = pool[activeIdx];
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);

        if (element.innerText === targetData.ans) {
            element.classList.add('correct');
            currentScore += 10;
            document.getElementById('score').innerText = currentScore;
            printLog("✅ 回答正确！太棒了！", "#d4edda", "#155724");
        } else {
            element.classList.add('incorrect');
            btns.forEach(b => { if (b.innerText === targetData.ans) b.classList.add('correct'); });
            printLog(`❌ 答错啦！正确答案应该是：<b>${targetData.ans}</b>`, "#fff5f5", "#e53e3e");
        }
        document.getElementById('next-q-btn').style.display = "inline-block";
    }

    function goNext() {
        activeIdx++;
        if (activeIdx < pool.length) { renderQuiz(); } else { finishGame(); }
    }

    function printLog(t, b, c) {
        const m = document.getElementById('msg'); m.innerHTML = t; m.style.backgroundColor = b; m.style.color = c;
    }

    function finishGame() {
        clearInterval(clockId);
        document.getElementById('quiz-container').style.display = "none";
        document.getElementById('next-q-btn').style.display = "none";
        const sBtn = document.getElementById('start-game-btn');
        sBtn.style.display = "inline-block";
        sBtn.innerText = "重新挑战";
        let note = currentScore === 100 ? "🥇 满分通关！你完美的掌握了东盟钱币知识！" : "👍 挑战完成！可以再试一次争取拿到满分哦！";
        printLog(`🎉 <b>大功告成！通关成功！</b><br>最终得分：<span style='color:#3182ce; font-size:1.5rem;'>${currentScore}</span> 分<br>总共耗时：<b>${seconds}</b> 秒<br><br>${note}`, "#ebf8ff", "#2b6cb0");
    }
</script>

</body>
</html>
