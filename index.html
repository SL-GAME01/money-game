<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：东盟钱币知识大闯关</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px; 
        }
        #game-box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 700px; 
            width: 100%;
            text-align: center; 
            border: 4px solid #4a90e2; 
        }
        .hint { 
            color: #4a5568; 
            background: #ebf8ff; 
            padding: 15px; 
            border-radius: 10px; 
            border-left: 5px solid #3182ce;
            text-align: left;
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .stats-bar { 
            display: flex; 
            justify-content: space-between;
            background: #edf2f7; 
            padding: 12px 25px; 
            border-radius: 12px; 
            margin-bottom: 25px;
            font-weight: bold;
        }
        
        /* 题目展示区 */
        #quiz-container { display: none; margin: 20px 0; text-align: left; }
        .question-text { font-size: 1.2rem; font-weight: bold; color: #2d3748; margin-bottom: 20px; line-height: 1.5; }
        
        /* 选项布局 */
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.05rem;
            font-weight: 500;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a5568;
            text-align: left;
        }
        .option-btn:hover { background: #edf2f7; border-color: #cbd5e0; }
        .option-btn.correct { background: #c6f6d5 !important; border-color: #38a169 !important; color: #22543d !important; font-weight: bold; }
        .option-btn.incorrect { background: #fff5f5 !important; border-color: #e53e3e !important; color: #9b2c2c !important; }

        #msg { margin: 20px 0; font-size: 1.2rem; font-weight: bold; min-height: 35px; padding: 12px; border-radius: 8px; text-align: center; }
        
        /* 居中大按钮 */
        .btn { 
            display: inline-block;
            margin: 15px auto; 
            padding: 14px 45px; 
            background: #3182ce; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 1.2rem; 
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(49,130,206,0.4);
            transition: all 0.2s;
        }
        .btn:hover { background: #2b6cb0; transform: scale(1.02); }
    </style>
</head>
<body>

<div id="game-box">
    <h2>🪙 三年级数学单元四：东盟钱币知识大闯关</h2>
    <div id="hint-text" class="hint">欢迎来到钱币大闯关！本测验共包含 10 道精选单选题，点击下方按钮即可开启挑战。</div>
    
    <div style="text-align: center;">
        <button id="action-btn" class="btn" onclick="startGame()">开始游戏</button>
    </div>
    
    <div class="stats-bar">
        <div>⏱️ 用时: <span id="timer">0</span> 秒</div>
        <div>📋 进度: <span id="progress">0 / 10</span></div>
        <div>✨ 得分: <span id="score">0</span></div>
    </div>
    
    <div id="quiz-container">
        <div class="question-text" id="question-text">题目加载中...</div>
