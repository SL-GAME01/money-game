<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：钱币终极闯关游戏</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px; 
        }
        #game-box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 800px; 
            width: 100%;
            text-align: center; 
            border: 4px solid #4a90e2; 
        }
        h2 { color: #2c3e50; margin-top: 0; font-size: 1.8rem; }
        .hint { 
            color: #4a5568; 
            font-size: 1rem; 
            margin-bottom: 20px; 
            background: #ebf8ff; 
            padding: 12px; 
            border-radius: 10px; 
            border-left: 5px solid #3182ce;
            text-align: left;
            line-height: 1.5;
        }
        .stats-bar { 
            display: flex; 
            justify-content: space-between;
            width: 100%; 
            margin-bottom: 25px; 
            background: #edf2f7; 
            padding: 12px 25px; 
            border-radius: 12px; 
        }
        .stat-item { font-size: 1.1rem; font-weight: bold; color: #4a5568; }
        #timer { color: #3182ce; }
        #score { color: #38a169; }
        #level { color: #805ad5; }
        
        /* 关卡通用区域 */
        .game-stage { display: none; width: 100%; min-height: 350px; }
        .game-stage.active { display: block; }

        /* 第一关：严格顺序连线样式 */
        .line-area { display: flex; justify-content: space-between; gap: 20px; }
        .column { display: flex; flex-direction: column; width: 50%; gap: 10px; }
        .item { 
            padding: 12px; background: #ffffff; border: 2px solid #cbd5e0; border-radius: 12px; 
            cursor: pointer; user-select: none; transition: all 0.2s ease; font-size: 0.95rem; 
            color: #2d3748; min-height: 55px; display: flex; align-items: center; justify-content: center; text-align: center; 
        }
        .item.locked { background: #f1f3f5; border-color: #e2e8f0; color: #a0aec0; cursor: not-allowed; }
        .item.active-target { border-color: #4a90e2; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5); font-weight: bold; }
        .item.selected { background: #ebf8ff; border-color: #3182ce; color: #2b6cb0; font-weight: bold; }
        .item.matched { background: #f0fff4; border-color: #38a169; color: #276749; pointer-events: none; opacity: 0.65; }
        .item.wrong { background: #fff5f5; border-color: #e53e3e; color: #9b2c2c; animation: shake 0.4s ease-in-out; }

        /* 第二关：拖拽思维导图样式 */
        .mindmap-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .branches { display: flex; justify-content: space-around; width: 100%; gap: 20px; margin-top: 10px; }
        .branch-box { 
            width: 45%; min-height: 180px; background: #f8fafc; border: 3px dashed #cbd5e0; 
            border-radius: 15px; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; 
            align-content: flex-start; justify-content: center; transition: all 0.3s;
        }
        .branch-box.drag-over { background: #edf2f7; border-color: #4a90e2; }
        .branch-title { width: 100%; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #2d3748; }
        #needs-box .branch-title { color: #dd6b20; }
        #wants-box .branch-title { color: #3182ce; }
        .pool-title { font-weight: bold; color: #718096; margin-top: 10px; }
        .drag-pool { 
            width: 100%; min-height: 80px; background: #edf2f7; border-radius: 12px; 
            padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
        }
        .drag-card { 
            padding: 10px 18px; background: #ffffff; border: 2px solid #cbd5e0; border-radius: 20px; 
            cursor: grab; font-weight: bold; color: #4a5568; box-shadow: 0 3px 6px rgba(0,0,0,0.05); user-select: none;
        }
        .drag-card.placed { background: #c6f6d5; border-color: #38a169; color: #22543d; cursor: default; }

        /* 第三关：竖式输入样式 */
        .math-container { display: flex; flex-direction: column; gap: 20px; align-items: center; padding: 10px; }
        .math-row { 
            display: flex; align-items: center; justify-content: space-between; 
            width: 100%; max-width: 650px; background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0;
        }
        .math-formula { font-size: 1.1rem; font-weight: bold; color: #2d3748; text-align: left; flex: 1; line-height: 1.5; }
        .math-input { 
            width: 160px; padding: 8px 12px; font-size: 1.1rem; border: 2px solid #cbd5e0; 
            border-radius: 8px; text-align: right; font-weight: bold; color: #2b6cb0;
        }
        .math-input:focus { border-color: #3182ce; outline: none; }
        .math-input.correct { background-color: #c6f6d5; border-color: #38a169; color: #22543d; pointer-events: none; }
        .math-input.incorrect { background-color: #fff5f5; border-color: #e53e3e; color: #9b2c2c; }

        /* 公共提示与按钮 */
        #msg { margin-top: 25px; font-size: 1.2rem; font-weight: bold; min-height: 35px; color: #2d3748; padding: 12px; border-radius: 8px; }
        .btn { 
            margin-top: 20px; padding: 12px 40px; background: #3182ce; color: white; border: none; 
            border-radius: 25px; cursor: pointer; font-size: 1.1rem; font-weight: bold; box-shadow: 0 4px 10px rgba(49,130,206,0.3); transition: all 0.2s;
        }
        .btn:hover { background: #2b6cb0; transform: translateY(-1px); }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    </style>
</head>
<body>

<div id="game-box">
    <h2>🪙 三年级数学单元四：钱币大冒险</h2>
    <div id="hint-text" class="hint">准备好了吗？点击下方按钮开始游戏，系统将开始正向计时！</div>
    
    <div class="stats-bar">
        <div class="stat-item">⏱️ 用时: <span id="timer">0</span> 秒</div>
        <div class="stat-item">⭐ 关卡: <span id="level">1/3</span></div>
        <div class="stat-item">✨ 得分: <span id="score">0</span></div>
    </div>
    
    <div id="stage-1" class="game-stage">
        <div class="line-area">
            <div class="column" id="left-col-1"></div>
            <div class="column" id="right-col-1"></div>
        </div>
    </div>

    <div id="stage-2" class="game-stage">
        <div class="mindmap-container">
            <div class="branches">
                <div class="branch-box" id="needs-box" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="handleDrop(event, 'needs')">
                    <div class="branch-title">🌾 需求 (Needs)</div>
                </div>
                <div class="branch-box" id="wants-box" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="handleDrop(event, 'wants')">
                    <div class="branch-title">🧸 要求 (Wants)</div>
                </div>
            </div>
            <div class="pool-title">👇 请把下面的物品拖拽到上面对应的思维导图分支中：</div>
            <div class="drag-pool" id="item-pool"></div>
        </div>
    </div>

    <div id="stage-3" class="game-stage">
        <div class="math-container" id="math-questions-box"></div>
    </div>

    <div id="msg">点击按钮启动测验！</div>
    <button id="action-btn" class="btn" onclick="initGame()">开始游戏</button>
</div>
