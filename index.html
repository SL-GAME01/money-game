<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：钱币小测验</title>
    <style>
        body { font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif; background: #eef2f7; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        #game-box { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); width: 650px; text-align: center; border: 4px solid #4caf50; }
        h2 { color: #2c3e50; margin-top: 0; font-size: 1.8rem; }
        .hint { color: #666; font-size: 0.95rem; margin-bottom: 15px; background: #e8f5e9; padding: 8px; border-radius: 8px; }
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.3rem; font-weight: bold; background: #f8f9fa; padding: 10px 20px; border-radius: 10px; border: 1px solid #ddd; }
        #timer { color: #e74c3c; }
        #score { color: #2ecc71; }
        .game-area { display: flex; justify-content: space-between; margin-top: 20px; min-height: 320px; }
        .column { display: flex; flex-direction: column; gap: 12px; width: 46%; }
        .item { padding: 12px 15px; background: #f1f3f5; border: 2px solid #ced4da; border-radius: 10px; cursor: pointer; user-select: none; transition: all 0.2s ease; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; min-height: 45px; }
        .item:hover { background: #e9ecef; border-color: #6c757d; transform: scale(1.02); }
        .item.selected { background: #d1ecf1; border-color: #17a2b8; color: #0c5460; font-weight: bold; }
        .item.matched { background: #d4edda; border-color: #28a745; color: #155724; pointer-events: none; opacity: 0.6; text-decoration: line-through; }
        .item.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.3s; }
        #msg { margin-top: 20px; font-size: 1.1rem; font-weight: bold; min-height: 30px; color: #495057; }
        .btn { margin-top: 15px; padding: 12px 30px; background: #4caf50; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 1.1rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn:hover { background: #45a049; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    </style>
</head>
<body>

<div id="game-box">
    <h2>🪙 三年级数学：钱币连线大挑战</h2>
    <div id="hint-text" class="hint">点击左边的国家，再点击右边对应的货币，在时间结束前完成连线！</div>
    
    <div class="stats-bar">
        <div>⏳ 时间: <span id="timer">60</span> 秒</div>
        <div>⭐ 关卡: <span id="level">1/2</span></div>
        <div>✨ 得分: <span id="score">0</span></div>
    </div>
    
    <div class="game-area">
        <div class="column" id="left-col"></div>
        <div class="column" id="right-col"></div>
    </div>

    <div id="msg">点击“开始游戏”按钮挑战最高分！</div>
    <button id="action-btn" class="btn" onclick="initGame()">开始游戏</button>
</div>

<script>
    // 关卡数据源
    const levels = [
        {
            hint: "第一关：东南亚各国货币辨识！请把【国家描述】与【正确货币】连起来！",
            data: [
                { id: 1, left: "🇸🇬 新加坡 (印有首任总统)", right: "元 (Dollar)" },
                { id: 2, left: "🇻🇳 越南 (印有胡志明头像)", right: "盾 (Dong)" },
                { id: 3, left: "🇹🇭 泰国 (印有现任泰王)", right: "泰铢 (Baht)" },
                { id: 4, left: "🇧🇳 文莱 (印有苏丹头像)", right: "元 (Dollar) " },
                { id: 5, left: "🇵🇭 菲律宾 (印有REPUBLIKA)", right: "比索 (Peso)" },
                { id: 6, left: "🇮🇩 印尼 (印有Bank Indonesia)", right: "盾 (Rupiah)" }
            ]
        },
        {
            hint: "第二关：理财观念对对碰！请把【生活物品】分类到【需求】或【要求】！",
            data: [
                { id: 10, left: "🍚 白饭 (维持生命)", right: "需求 (Needs)" },
                { id: 11, left: "🏠 房子 (避风港)", right: "需求 (Needs)" },
                { id: 12, left: "👚 衣服 (保暖御寒)", right: "需求 (Needs)" },
                { id: 13, left: "💄 化妆品 (美化外表)", right: "要求 (Wants)" },
                { id: 14, left: "🍟 零食 / 🧸 玩具", right: "要求 (Wants)" },
                { id: 15, left: "🎮 电子游戏 / 💎 珠宝", right: "要求 (Wants)" }
            ]
        }
    ];

    let currentLevel = 0;
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let selectedLeft = null;
    let selectedRight = null;
    let matchedCount = 0;
    let isPlaying = false;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        score = 0;
        timeLeft = 60;
        currentLevel = 0;
        isPlaying = true;
        document.getElementById('action-btn').style.display = "none";
        
        // 开启倒计时
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame(false);
            }
        }, 1000);

        loadLevel(currentLevel);
    }

    function loadLevel(lvlIdx) {
        matchedCount = 0;
        selectedLeft = null;
        selectedRight = null;
        
        const lvl = levels[lvlIdx];
        document.getElementById('level').innerText = `${lvlIdx + 1}/${levels.length}`;
        document.getElementById('hint-text').innerText = lvl.hint;
        document.getElementById('score').innerText = score;
        document.getElementById('msg').innerText = "请连线！";

        // 打乱左右两边
        const leftItems = shuffle([...lvl.data]);
        const rightItems = shuffle([...lvl.data]);

        const leftCol = document.getElementById('left-col');
        const rightCol = document.getElementById('right-col');
        leftCol.innerHTML = '';
        rightCol.innerHTML = '';

        leftItems.forEach(item => {
            leftCol.innerHTML += `<div class="item" data-id="${item.id}" onclick="clickLeft(this)">${item.left}</div>`;
        });

        rightItems.forEach(item => {
            // 注意：第二关有多个重复的右侧选项(需求/要求)，我们需要通过原始数据匹配判断
            rightCol.innerHTML += `<div class="item" data-id="${item.id}" onclick="clickRight(this)">${item.right}</div>`;
        });
    }

    function clickLeft(el) {
        if (!isPlaying || el.classList.contains('matched')) return;
        document.querySelectorAll('#left-col .item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        selectedLeft = el;
        checkMatch();
    }

    function clickRight(el) {
        if (!isPlaying || el.classList.contains('matched')) return;
        document.querySelectorAll('#right-col .item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        selectedRight = el;
        checkMatch();
    }

    function checkMatch() {
        if (selectedLeft && selectedRight) {
            const leftId = parseInt(selectedLeft.getAttribute('data-id'));
            const rightId = parseInt(selectedRight.getAttribute('data-id'));

            // 判断逻辑：
            // 第一关：ID必须完全一样
            // 第二关：支持多对一模糊匹配（10,11,12都算需求；13,14,15都算要求）
            let isCorrect = false;
            if (currentLevel === 0 && leftId === rightId) {
                isCorrect = true;
            } else if (currentLevel === 1) {
                const isLeftNeed = leftId <= 12;
                const isRightNeed = rightId <= 12;
                if (isLeftNeed === isRightNeed) isCorrect = true;
            }

            if (isCorrect) {
                selectedLeft.classList.replaceAll('selected', 'matched');
                selectedRight.classList.replaceAll('selected', 'matched');
                score += 10;
                matchedCount++;
                document.getElementById('score').innerText = score;
                document.getElementById('msg').style.color = "#28a745";
                document.getElementById('msg').innerText = "✅ 答对啦！得分 +10";
                
                if (matchedCount === levels[currentLevel].data.length) {
                    nextLevel();
                }
            } else {
                const l = selectedLeft;
                const r = selectedRight;
                l.classList.add('wrong');
                r.classList.add('wrong');
                document.getElementById('msg').style.color = "#dc3545";
                document.getElementById('msg').innerText = "❌ 连错了，再试一次！";
                setTimeout(() => {
                    l.classList.remove('selected', 'wrong');
                    r.classList.remove('selected', 'wrong');
                }, 500);
            }
            selectedLeft = null;
            selectedRight = null;
        }
    }

    function nextLevel() {
        currentLevel++;
        if (currentLevel < levels.length) {
            document.getElementById('msg').innerText = "🎉 太棒了！准备进入下一关...";
            setTimeout(() => {
                loadLevel(currentLevel);
            }, 1200);
        } else {
            endGame(true);
        }
    }

    function endGame(isWin) {
        clearInterval(timerInterval);
        isPlaying = false;
        const btn = document.getElementById('action-btn');
        btn.style.display = "inline-block";
        btn.innerText = "再玩一次";
        
        if (isWin) {
            document.getElementById('msg').style.color = "#28a745";
            document.getElementById('msg').innerHTML = `🏆 恭喜通关！你太棒了！<br>最终得分：${score} 分！`;
        } else {
            document.getElementById('msg').style.color = "#dc3545";
            document.getElementById('msg').innerHTML = `⏰ 时间到！游戏结束。<br>最终得分：${score} 分。`;
        }
    }
</script>

</body>
</html>
