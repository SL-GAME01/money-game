<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：东盟国家钱币辨识 Quiz</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background-color: #f7fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px; 
        }
        #quiz-card { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
            max-width: 550px; 
            width: 100%; 
            text-align: center; 
            border: 3px solid #3182ce; 
        }
        .hint-box { 
            color: #4a5568; 
            background: #ebf8ff; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            font-size: 0.95rem;
        }
        .score-board { 
            display: flex; 
            justify-content: space-between; 
            background: #edf2f7; 
            padding: 10px 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-weight: bold; 
        }
        
        /* 100% 稳定的原生图片显示区 */
        #image-area {
            display: none;
            width: 100%;
            margin: 15px 0;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 5px;
            background: #fff;
        }
        #coin-pic {
            width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: contain;
            display: block;
            border-radius: 6px;
        }
        
        /* 兜底文字提示框（双重保险） */
        #backup-hint {
            display: none;
            margin-top: 8px;
            padding: 8px;
            background: #fff8e1;
            border: 1px solid #ffe082;
            border-radius: 6px;
            color: #b76e00;
            font-size: 0.9rem;
            font-weight: bold;
        }

        #quiz-main { display: none; text-align: left; }
        .q-title { font-size: 1.1rem; font-weight: bold; color: #2d3748; margin-bottom: 15px; text-align: center; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        
        .opt-btn { 
            width: 100%; 
            padding: 14px 18px; 
            font-size: 1rem; 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            cursor: pointer; 
            text-align: left; 
            color: #4a5568; 
        }
        .opt-btn:hover:not(:disabled) { background: #edf2f7; }
        .opt-btn.correct { background: #c6f6d5 !important; border-color: #38a169 !important; color: #22543d !important; font-weight: bold; }
        .opt-btn.incorrect { background: #fff5f5 !important; border-color: #e53e3e !important; color: #9b2c2c !important; }
        
        #feedback { margin: 15px 0; font-size: 1.1rem; font-weight: bold; min-height: 40px; padding: 10px; border-radius: 6px; text-align: center; }
