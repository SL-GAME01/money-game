<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：东盟钱币知识大闯关</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px; 
        }
        #game-box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 700px; 
            width: 100%;
            text-align: center; 
            border: 4px solid #4a90e2; 
        }
        .hint { 
            color: #4a5568; 
            background: #ebf8ff; 
            padding: 15px; 
            border-radius: 10px; 
            border-left: 5px solid #3182ce;
            text-align: left;
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .stats-bar { 
            display: flex; 
            justify-content: space-between;
            background: #edf2f7; 
            padding: 12px 25px; 
            border-radius: 12px; 
            margin-bottom: 25px;
            font-weight: bold;
        }
        
        /* 题目展示区 */
        #quiz-container { display: none; margin: 20px 0; text-align: left; }
        .question-text { font-size: 1.2rem; font-weight: bold; color: #2d3748; margin-bottom: 20px; line-height: 1.5; }
        
        /* 选项布局 */
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            padding: 15px 20px;
            font-size: 1.05rem;
            font-weight: 500;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a5568;
            text-align: left;
        }
        .option-btn:hover { background: #edf2f7; border-color: #cbd5e0; }
        .option-btn.correct { background: #c6f6d5 !important; border-color: #38a169 !important; color: #22543d !important; font-weight: bold; }
        .option-btn.incorrect { background: #fff5f5 !important; border-color: #e53e3e !important; color: #9b2c2c !important; }

        #msg { margin: 20px 0; font-size: 1.2rem; font-weight: bold; min-height: 35px; padding: 12px; border-radius: 8px; text-align: center; }
        
        /* 居中大按钮 */
        .btn { 
            display: inline-block;
            margin: 15px auto; 
            padding: 14px 45px; 
            background: #3182ce; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 1.2rem; 
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(49,130,206,0.4);
            transition: all 0.2s;
        }
        .btn:hover { background: #2b6cb0; transform: scale(1.02); }
    </style>
</head>
<body>

<div id="game-box">
    <h2>🪙 三年级数学单元四：东盟钱币知识大闯关</h2>
    <div id="hint-text" class="hint">欢迎来到钱币大闯关！本测验共包含 10 道精选单选题，点击下方按钮即可开启挑战。</div>
    
    <div style="text-align: center;">
        <button id="action-btn" class="btn" onclick="startGame()">开始游戏</button>
    </div>
    
    <div class="stats-bar">
        <div>⏱️ 用时: <span id="timer">0</span> 秒</div>
        <div>📋 进度: <span id="progress">0 / 10</span></div>
        <div>✨ 得分: <span id="score">0</span></div>
    </div>
    
    <div id="quiz-container">
        <div class="question-text" id="question-text">题目加载中...</div>
        <div class="options-list" id="options-box">
            <button class="option-btn" onclick="checkAnswer(this, 0)"></button>
            <button class="option-btn" onclick="checkAnswer(this, 1)"></button>
            <button class="option-btn" onclick="checkAnswer(this, 2)"></button>
            <button class="option-btn" onclick="checkAnswer(this, 3)"></button>
        </div>
    </div>

    <div id="msg">点击上方蓝色按钮启动游戏！</div>
    
    <div style="text-align: center;">
        <button id="next-btn" class="btn" style="display: none;" onclick="nextQuestion()">下一题 ➡️</button>
    </div>
</div>

<script>
    // 根据您的 10 张截图，100% 精准还原的题库数据
    const quizData = [
        { q: "在东南亚国家联盟（东盟）中，哪个国家使用的钱币单位是“铢”（Baht）？", options: ["越南", "泰国", "菲律宾", "老挝"], ans: "泰国" },
        { q: "新加坡和文莱这两个东盟国家使用的钱币单位名称在课本中共同称为什么？", options: ["卢比", "令吉", "盾", "元"], ans: "元" },
        { q: "如果你在印度尼西亚（Indonesia）旅游，你最可能使用哪种钱币单位？", options: ["基普", "比索", "卢比", "瑞尔"], ans: "卢比" },
        { q: "钱币单位“盾”（Dong）属于以下哪个东盟国家？", options: ["越南", "柬埔寨", "文莱", "缅甸"], ans: "越南" },
        { q: "菲律宾（Philippines）使用的钱币单位名称是？", options: ["令吉", "铢", "瑞尔", "比索"], ans: "比索" },
        { q: "在数学课本第15页中，老挝（Laos）的钱币单位被标注为：", options: ["基普", "元", "瑞尔", "卢比"], ans: "基普" },
        { q: "哪一个国家的钱币单位是“瑞尔”（Riel）？", options: ["菲律宾", "缅甸", "柬埔寨", "泰国"], ans: "柬埔寨" },
        { q: "根据课本第16页的汇率表，缅甸（Myanmar）使用的钱币单位名称是？", options: ["铢", "令吉", "元", "元 (Kyat)"], ans: "元 (Kyat)" }, // 对应截图8中的元
        { q: "马来西亚的法宝钱币单位名称是？", options: ["铢", "比索", "元", "令吉"], ans: "令吉" },
        { q: "关于不同国家的钱币，下列哪项说明符合课本第14页的内容？", options: [
            "东盟国家只使用纸币，不使用硬币。",
            "所有东盟国家的钱币单位名称都一样。",
            "1令吉的币值在任何时候都等于7.91铢。",
            "不同国家的钱币面额可能相同，但不一定等值。"
        ], ans: "不同国家的钱币面额可能相同，但不一定等值。" }
    ];

    let currentIdx = 0;
    let score = 0;
    let timeElapsed = 0;
    let timerInterval = null;
    let shuffledQuiz = [];
    let hasAnswered = false;

    function startGame() {
        score = 0;
        timeElapsed = 0;
        currentIdx = 0;
        document.getElementById('action-btn').style.display = "none";
        document.getElementById('quiz-container').style.display = "block";
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeElapsed;
        
        // 启动计时器
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeElapsed++;
            document.getElementById('timer').innerText = timeElapsed;
        }, 1000);

        // 全题库随机乱序
        shuffledQuiz = [...quizData].sort(() => Math.random() - 0.5);
        loadQuestion();
    }

    function loadQuestion() {
        hasAnswered = false;
        document.getElementById('next-btn').style.display = "none";
        updateMsg("请读题并选择你认为正确的答案选项。", "transparent", "#2d3748");
        document.getElementById('progress').innerText = `${currentIdx + 1} / 10`;

        const currentQ = shuffledQuiz[currentIdx];
        document.getElementById('question-text').innerText = `${currentIdx + 1}. ${currentQ.q}`;

        // 选项随机打乱
        let shuffledOptions = [...currentQ.options].sort(() => Math.random() - 0.5);
        
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, i) => {
            btn.className = "option-btn"; 
            btn.innerText = shuffledOptions[i];
        });
    }

    function checkAnswer(selectedBtn, idx) {
        if (hasAnswered) return; // 防止重复点击
        hasAnswered = true;

        const currentQ = shuffledQuiz[currentIdx];
        const buttons = document.querySelectorAll('.option-btn');

        if (selectedBtn.innerText === currentQ.ans) {
            selectedBtn.classList.add('correct');
            score += 10;
            document.getElementById('score').innerText = score;
            updateMsg("✅ 回答正确！太棒了！", "#d4edda", "#155724");
        } else {
            selectedBtn.classList.add('incorrect');
            // 自动亮起正确的那一项
            buttons.forEach(btn => {
                if (btn.innerText === currentQ.ans) {
                    btn.classList.add('correct');
                }
            });
            updateMsg(`❌ 答错啦！正确答案应该是：${currentQ.ans}`, "#fff5f5", "#e53e3e");
        }

        // 显示下一题按钮
        document.getElementById('next-btn').style.display = "inline-block";
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < shuffledQuiz.length) {
            loadQuestion();
        } else {
            endGame();
        }
    }

    function updateMsg(txt, bg, color) {
        const m = document.getElementById('msg');
        m.innerHTML = txt; m.style.backgroundColor = bg; m.style.color = color;
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('quiz-container').style.display = "none";
        document.getElementById('next-btn').style.display = "none";
        
        const actionBtn = document.getElementById('action-btn');
        actionBtn.style.display = "inline-block";
        actionBtn.innerText = "重新挑战";

        let comment = score === 100 ? "🥇 满分通关！你完美的掌握了东盟钱币知识！" : "👍 挑战完成
