<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：东南亚钱币大辨识</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background-color: #f7fafc; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px; 
        }
        #game-box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 650px; 
            width: 100%;
            text-align: center; 
            border: 4px solid #4a90e2; 
        }
        .hint { 
            color: #4a5568; 
            background: #ebf8ff; 
            padding: 12px; 
            border-radius: 10px; 
            border-left: 5px solid #3182ce;
            text-align: left;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .stats-bar { 
            display: flex; 
            justify-content: space-between;
            background: #edf2f7; 
            padding: 12px 25px; 
            border-radius: 12px; 
            margin-bottom: 25px;
            font-weight: bold;
        }
        
        /* 核心纸币图形样式 - 用纯代码手绘仿真纸币，100%不卡顿不失效 */
        #bill-container {
            margin: 25px auto;
            width: 100%;
            max-width: 380px;
            height: 190px;
            perspective: 1000px;
            display: none;
        }
        .bill-card {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 3px double rgba(255,255,255,0.4);
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        /* 纸币内部的水印圈和装饰花纹 */
        .bill-watermark {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px dashed rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            text-align: center;
        }
        .bill-top { display: flex; justify-content: space-between; font-size: 1.3rem; }
        .bill-center { font-size: 1rem; text-align: left; max-width: 70%; line-height: 1.4; margin-top: 10px; }
        .bill-bottom { text-align: left; font-size: 0.9rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        /* 选项按钮样式 */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .option-btn {
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            background: #ffffff;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a5568;
        }
        .option-btn:hover { background: #f7fafc; border-color: #4a90e2; transform: translateY(-1px); }
        .option-btn.correct { background: #c6f6d5 !important; border-color: #38a169 !important; color: #22543d !important; }
        .option-btn.incorrect { background: #fff5f5 !important; border-color: #e53e3e !important; color: #9b2c2c !important; }

        #msg { margin: 20px 0; font-size: 1.2rem; font-weight: bold; min-height: 35px; padding: 12px; border-radius: 8px; }
        
        .btn { 
            display: inline-block;
            margin: 20px auto; 
            padding: 15px 50px; 
            background: #3182ce; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 1.3rem; 
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(49,130,206,0.4);
        }
    </style>
</head>
<body>

<div id="game-box">
    <h2>🪙 东南亚钱币大辨识游戏</h2>
    <div id="hint-text" class="hint">看清中央纸币上的特殊头像、防伪特征与文字提示，点击下方按钮选出它属于哪一个国家吧！</div>
    
    <button id="action-btn" class="btn" onclick="startGame()">开始游戏</button>
    
    <div class="stats-bar">
        <div>✨ 得分: <span id="score">0</span></div>
        <div>进度: <span id="progress">0 / 8</span></div>
    </div>
    
    <div id="bill-container">
        <div class="bill-card" id="bill-card">
            <div class="bill-top">
                <span id="bill-value">$$$</span>
                <span style="font-size: 0.9rem; opacity: 0.8;">BANK NOTE</span>
            </div>
            <div class="bill-center" id="bill-desc">纸币特征描述</div>
            <div class="bill-watermark" id="bill-water">水印头像</div>
            <div class="bill-bottom" id="bill-serial">序列号: SEAsia-2026</div>
        </div>
    </div>

    <div class="options-grid" id="options-box" style="display: none;">
        <button class="option-btn" onclick="checkAnswer(this)"></button>
        <button class="option-btn" onclick="checkAnswer(this)"></button>
        <button class="option-btn" onclick="checkAnswer(this)"></button>
        <button class="option-btn" onclick="checkAnswer(this)"></button>
    </div>

    <div id="msg">点击蓝色按钮启动游戏！</div>
</div>

<script>
    // 游戏核心题库数据
    const quizData = [
        { country: "马来西亚", value: "RM5", desc: "纸币整体呈绿色，印有第一任最高元首肖像", water: "最高元首", bg: "linear-gradient(135deg, #2ecc71, #27ae60)" },
        { country: "越南", value: "500,000 ₫", desc: "印有“CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM”字样及胡志明头像", water: "胡志明", bg: "linear-gradient(135deg, #3498db, #2980b9)" },
        { country: "泰国", value: "20 Baht", desc: "印有“Thailand”字样及现任拉玛九世或十世泰王头像", water: "泰王肖像", bg: "linear-gradient(135deg, #1abc9c, #16a085)" },
        { country: "新加坡", value: "S$100", desc: "纸币印有“Singapore”字样及首任总统尤索夫·伊萨肖像", water: "尤索夫总统", bg: "linear-gradient(135deg, #e74c3c, #c0392b)" },
        { country: "菲律宾", value: "1000 ₱", desc: "纸币印有“REPUBLIKA NG PILIPINAS”字样", water: "菲律宾英雄", bg: "linear-gradient(135deg, #9b59b6, #8e44ad)" },
        { country: "印度尼西亚", value: "Rp Rp", desc: "纸币印有“Bank Indonesia”及具有“SAMPLE”字样的水印", water: "SAMPLE", bg: "linear-gradient(135deg, #f1c40f, #f39c12)" },
        { country: "文莱", value: "B$", desc: "纸币印有“NEGARA BRUNEI DARUSSALAM”及苏丹肖像", water: "苏丹肖像", bg: "linear-gradient(135deg, #34495e, #2c3e50)" },
        { country: "缅甸", value: "Ks Ks", desc: "纸币印有缅甸国家标志及“Central Bank of Myanmar”字样", water: "国家标志", bg: "linear-gradient(135deg, #e67e22, #d35400)" }
    ];

    const allCountries = ["马来西亚", "越南", "泰国", "新加坡", "菲律宾", "印度尼西亚", "文莱", "缅甸", "老挝", "柬埔寨"];

    let currentQuestionIndex = 0;
    let score = 0;
    let shuffledQuiz = [];
    let canClick = true;

    function startGame() {
        score = 0;
        currentQuestionIndex = 0;
        document.getElementById('action-btn').style.display = "none";
        document.getElementById('bill-container').style.display = "block";
        document.getElementById('options-box').style.display = "grid";
        document.getElementById('score').innerText = score;
        
        // 打乱题目顺序
        shuffledQuiz = [...quizData].sort(() => Math.random() - 0.5);
        loadQuestion();
    }

    function loadQuestion() {
        canClick = true;
        updateMsg("请选择正确的国家！", "transparent", "#2d3748");
        document.getElementById('progress').innerText = `${currentQuestionIndex + 1} / 8`;
        
        const currentQ = shuffledQuiz[currentQuestionIndex];
        
        // 渲染仿真卡片数据
        const card = document.getElementById('bill-card');
        card.style.background = currentQ.bg;
        document.getElementById('bill-value').innerText = currentQ.value;
        document.getElementById('bill-desc').innerText = currentQ.desc;
        document.getElementById('bill-water').innerText = currentQ.water;
        document.getElementById('bill-serial').innerText = `序列号: SEA-${Math.floor(100000 + Math.random() * 900000)}`;

        // 生成4个选项（1个正确答案 + 3个随机干扰项）
        let options = [currentQ.country];
        let wrongPool = allCountries.filter(c => c !== currentQ.country);
        wrongPool.sort(() => Math.random() - 0.5);
        options.push(wrongPool[0], wrongPool[1], wrongPool[2]);
        
        // 选项洗牌
        options.sort(() => Math.random() - 0.5);

        // 渲染到按钮上
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.className = "option-btn"; // 复位颜色样式
            btn.innerText = options[idx];
        });
    }

    function checkAnswer(selectedButton) {
        if (!canClick) return;
        canClick = false;

        const currentQ = shuffledQuiz[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');

        if (selectedButton.innerText === currentQ.country) {
            // 答对了
            selectedButton.classList.add('correct');
            score += 12.5; // 8题满分100分
            document.getElementById('score').innerText = Math.round(score);
            updateMsg("✅ 太棒了！回答完全正确。", "#d4edda", "#155724");
        } else {
            // 答错了
            selectedButton.classList.add('incorrect');
            // 找出正确的那个帮学生亮起绿色
            buttons.forEach(btn => {
                if (btn.innerText === currentQ.country) btn.classList.add('correct');
            });
            updateMsg(`❌ 答错啦，这其实是【${currentQ.country}】的钱币特征！`, "#fff5f5", "#e53e3e");
        }

        // 延迟1.8秒切入下一题
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuiz.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }, 1800);
    }

    function updateMsg(txt, bg, color) {
        const m = document.getElementById('msg');
        m.innerHTML = txt; m.style.backgroundColor = bg; m.style.color = color;
    }

    function endGame() {
        document.getElementById('bill-container').style.display = "none";
        document.getElementById('options-box').style.display = "none";
        const btn = document.getElementById('action-btn');
        btn.style.display = "block";
        btn.innerText = "重新挑战";
        
        let evaluation = score >= 80 ? "🏆 太牛了！你是真正的东南亚钱币专家！" : "✨ 表现不错！再来一局争取满分吧！";
        updateMsg(`🎉 <b>挑战结束！</b><br>您的最终总得分：<span style='color:#3182ce; font-size:1.5rem;'>${Math.round(score)}</span> 分！<br><br>${evaluation}`, "#ebf8ff", "#2b6cb0");
    }
</script>

</body>
</html>
