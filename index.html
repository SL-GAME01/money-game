<html lang="zh-CN">

        * { box-sizing: border-box; }
        body {

            background-color: #f0f4f8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px; 
        }
        #game-box { 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 600px; 
            width: 100%; 
            text-align: center; 
            border: 4px solid #4a90e2; 
        }
        .hint { 
            color: #4a5568; 
            background: #ebf8ff; 
            padding: 12px; 
            border-radius: 10px; 
            border-left: 5px solid #3182ce; 
            text-align: left; 
            margin-bottom: 15px; 
            font-size: 0.95rem;
            line-height: 1.5; 
        }
        .stats-bar { 
            display: flex; 
            justify-content: space-between; 
            background: #edf2f7; 
            padding: 12px 20px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            font-weight: bold; 
        }
        
        /* 100% 稳定卡片式图片区域 */
        #coin-card {
            display: none;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .flag-box {
            width: 100px;
            height: 60px;
            margin: 0 auto 15px auto;
            border: 2px solid white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .coin-title {
            font-size: 2rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        .coin-sub {
            font-size: 1.2rem;
            opacity: 0.9;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
