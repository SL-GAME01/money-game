<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 小动物的算草工坊 🧮</title>
    <style>
        :root {
            --bg-color: #f4fbf7;
            --card-bg: #ffffff;
            --primary-color: #66bb6a;
            --primary-dark: #388e3c;
            --accent-color: #ffa726;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .game-container {
            background-color: var(--card-bg);
            border: 4px solid var(--primary-color);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 850px;
            padding: 20px;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px dashed #c8e6c9;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .level-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-dark);
        }

        .progress-badge {
            font-size: 16px;
            background: #fff3e0;
            padding: 6px 16px;
            border-radius: 16px;
            border: 2px solid #ffe0b2;
            font-weight: bold;
            color: #e65100;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 650px) {
            .main-layout {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }

        .question-card {
            background: #e8f5e9;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .question-text {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #1b5e20;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 240px;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
        }

        input[type="text"] {
            font-size: 18px;
            padding: 8px 12px;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            text-align: center;
            width: 120px;
            outline: none;
        }

        /* 电子草稿板样式 */
        .scratch-pad {
            background: #fff;
            border: 3px solid #b2dfdb;
            border-radius: 18px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-tools {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .tool-btn {
            background: #e0f2f1;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: #004d40;
        }

        .tool-btn.active {
            background: #80cbc4;
            color: #fff;
        }

        canvas {
            border: 2px dashed #b2dfdb;
            border-radius: 12px;
            background-color: #fafafa;
            cursor: crosshair;
            touch-action: none;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px #f57c00;
            margin-top: 15px;
            transition: all 0.1s;
        }

        .btn-submit:active {
            box-shadow: 0 1px #f57c00;
            transform: translateY(3px);
        }

        .feedback {
            font-size: 18px;
            font-weight: bold;
            height: 30px;
            margin-top: 10px;
        }

        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="level-title" id="level-name">关卡加载中...</div>
        <div class="progress-badge">第 <span id="current-q">1</span> / <span id="total-q">24</span> 题</div>
    </div>

    <div id="game-body">
        <div class="main-layout">
            <!-- 左侧：题目与答题区域 -->
            <div class="question-card">
                <div class="question-text" id="question-text">31 456 + 26 423 = ?</div>

                <div class="input-group">
                    <!-- 普通题目输入框 -->
                    <div class="input-row" id="row-single">
                        <span>答案：</span>
                        <input type="text" id="inp-ans" placeholder="请输入数字">
                    </div>

                    <!-- 余数除法题目输入框 -->
                    <div class="input-row hidden" id="row-quotient">
                        <span>商：</span>
                        <input type="text" id="inp-q" placeholder="商">
                    </div>
                    <div class="input-row hidden" id="row-remainder">
                        <span>余数：</span>
                        <input type="text" id="inp-r" placeholder="余数">
                    </div>
                </div>

                <button class="btn-submit" onclick="checkAnswer()">提交答案 🚀</button>
                <div class="feedback" id="feedback"></div>
            </div>

            <!-- 右侧：电子草稿画板 -->
            <div class="scratch-pad">
                <div class="canvas-tools">
                    <button class="tool-btn active" id="pen-btn" onclick="setTool('pen')">✏️ 画笔</button>
                    <button class="tool-btn" id="eraser-btn" onclick="setTool('eraser')">🧹 橡皮</button>
                    <button class="tool-btn" onclick="clearCanvas()">🗑️ 清空算草</button>
                </div>
                <canvas id="paintCanvas" width="300" height="260"></canvas>
            </div>
        </div>
    </div>

    <!-- 通关界面 -->
    <div id="finish-screen" class="hidden">
        <h2>🎉 太棒了！你完成了全部算草大挑战！ 🏆</h2>
        <p style="font-size:18px;">你真是个了不起的数学小达人！✨</p>
        <button class="btn-submit" onclick="location.reload()">再玩一次 🔄</button>
    </div>
</div>

<script>
    // 全部 24 道运算题目
    const questions = [
        // 第一关：加法与减法
        { category: "🐻 小熊的加减算草工坊", q: "31 456 + 26 423 =", hasRemainder: false, ans: "57879" },
        { category: "🐻 小熊的加减算草工坊", q: "21 307 + 15 329 + 31 169 =", hasRemainder: false, ans: "67805" },
        { category: "🐻 小熊的加减算草工坊", q: "54 658 + 5 374 + 3 814 + 470 =", hasRemainder: false, ans: "64316" },
        { category: "🐻 小熊的加减算草工坊", q: "58 429 - 37 215 =", hasRemainder: false, ans: "21214" },
        { category: "🐻 小熊的加减算草工坊", q: "286 594 - 21 537 =", hasRemainder: false, ans: "265057" },
        { category: "🐻 小熊的加减算草工坊", q: "363 984 - 2 451 - 25 672 =", hasRemainder: false, ans: "335861" },

        // 第二关：加减混合运算
        { category: "🐰 小兔的加减混合冒险", q: "23 713 + 36 282 - 19 514 =", hasRemainder: false, ans: "40481" },
        { category: "🐰 小兔的加减混合冒险", q: "56 784 - 32 562 + 51 648 =", hasRemainder: false, ans: "75870" },
        { category: "🐰 小兔的加减混合冒险", q: "42 318 + 15 679 - 26 934 =", hasRemainder: false, ans: "31063" },
        { category: "🐰 小兔的加减混合冒险", q: "41 529 - 6 398 + 16 482 =", hasRemainder: false, ans: "51613" },

        // 第三关：乘法与除法
        { category: "🐱 小猫的乘除计算屋", q: "3 × 32 123 =", hasRemainder: false, ans: "96369" },
        { category: "🐱 小猫的乘除计算屋", q: "18 × 523 =", hasRemainder: false, ans: "9414" },
        { category: "🐱 小猫的乘除计算屋", q: "1 048 × 10 =", hasRemainder: false, ans: "10480" },
        { category: "🐱 小猫的乘除计算屋", q: "309 × 100 =", hasRemainder: false, ans: "30900" },
        { category: "🐱 小猫的乘除计算屋", q: "74 × 1 000 =", hasRemainder: false, ans: "74000" },
        { category: "🐱 小猫的乘除计算屋", q: "16 500 ÷ 3 =", hasRemainder: false, ans: "5500" },
        { category: "🐱 小猫的乘除计算屋", q: "73 285 ÷ 21 =", hasRemainder: true, quotient: "3489", remainder: "16" },
        { category: "🐱 小猫的乘除计算屋", q: "52 000 ÷ 10 =", hasRemainder: false, ans: "5200" },
        { category: "🐱 小猫的乘除计算屋", q: "72 314 ÷ 100 =", hasRemainder: true, quotient: "723", remainder: "14" },
        { category: "🐱 小猫的乘除计算屋", q: "30 302 ÷ 1 000 =", hasRemainder: true, quotient: "30", remainder: "302" },

        // 第四关：乘除混合运算
        { category: "🐵 小猴的乘除终极挑战", q: "2 466 × 4 ÷ 8 =", hasRemainder: false, ans: "1233" },
        { category: "🐵 小猴的乘除终极挑战", q: "9 506 ÷ 7 × 9 =", hasRemainder: false, ans: "12222" },
        { category: "🐵 小猴的乘除终极挑战", q: "3 028 × 8 ÷ 16 =", hasRemainder: false, ans: "1514" },
        { category: "🐵 小猴的乘除终极挑战", q: "27 720 ÷ 45 × 14 =", hasRemainder: false, ans: "8624" }
    ];

    let currentIdx = 0;

    function loadQuestion() {
        const item = questions[currentIdx];
        document.getElementById('level-name').innerText = item.category;
        document.getElementById('question-text').innerText = item.q;
        document.getElementById('current-q').innerText = currentIdx + 1;
        document.getElementById('total-q').innerText = questions.length;
        document.getElementById('feedback').innerText = '';

        // 清空输入框
        document.getElementById('inp-ans').value = '';
        document.getElementById('inp-q').value = '';
        document.getElementById('inp-r').value = '';

        // 切换输入框显示
        if (item.hasRemainder) {
            document.getElementById('row-single').classList.add('hidden');
            document.getElementById('row-quotient').classList.remove('hidden');
            document.getElementById('row-remainder').classList.remove('hidden');
        } else {
            document.getElementById('row-single').classList.remove('hidden');
            document.getElementById('row-quotient').classList.add('hidden');
            document.getElementById('row-remainder').classList.add('hidden');
        }

        clearCanvas();
    }

    function checkAnswer() {
        const item = questions[currentIdx];
        let isCorrect = false;

        if (item.hasRemainder) {
            const userQ = document.getElementById('inp-q').value.trim();
            const userR = document.getElementById('inp-r').value.trim();
            isCorrect = (userQ === item.quotient && userR === item.remainder);
        } else {
            const userAns = document.getElementById('inp-ans').value.trim().replace(/\s+/g, '');
            isCorrect = (userAns === item.ans);
        }

        const fb = document.getElementById('feedback');
        if (isCorrect) {
            fb.innerText = "✨ 太棒了，计算正确！";
            fb.className = "feedback correct";
            setTimeout(() => {
                currentIdx++;
                if (currentIdx < questions.length) {
                    loadQuestion();
                } else {
                    document.getElementById('game-body').classList.add('hidden');
                    document.getElementById('finish-screen').classList.remove('hidden');
                }
            }, 1000);
        } else {
            fb.innerText = "❌ 算错了，在草稿板上再检查一下吧！";
            fb.className = "feedback wrong";
        }
    }

    // --- 画板相关逻辑 ---
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentTool = 'pen';

    function startDrawing(e) {
        isDrawing = true;
        draw(e);
    }

    function stopDrawing() {
        isDrawing = false;
        ctx.beginPath();
    }

    function draw(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.lineWidth = currentTool === 'eraser' ? 16 : 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = currentTool === 'eraser' ? '#fafafa' : '#2c3e50';

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    function setTool(tool) {
        currentTool = tool;
        document.getElementById('pen-btn').classList.toggle('active', tool === 'pen');
        document.getElementById('eraser-btn').classList.toggle('active', tool === 'eraser');
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mousemove', draw);

    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchmove', draw);

    // 初始化加载第一题
    loadQuestion();
</script>
</body>
</html>
