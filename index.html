<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：钱币终极闯关游戏</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px; 
        }
        #game-box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 800px; 
            width: 100%;
            text-align: center; 
            border: 4px solid #4a90e2; 
        }
        h2 { color: #2c3e50; margin-top: 0; font-size: 1.8rem; }
        .hint { 
            color: #4a5568; 
            font-size: 1rem; 
            margin-bottom: 20px; 
            background: #ebf8ff; 
            padding: 12px; 
            border-radius: 10px; 
            border-left: 5px solid #3182ce;
            text-align: left;
            line-height: 1.5;
        }
        .stats-bar { 
            display: flex; 
            justify-content: space-between;
            width: 100%; 
            margin-bottom: 25px; 
            background: #edf2f7; 
            padding: 12px 25px; 
            border-radius: 12px; 
        }
        .stat-item { font-size: 1.1rem; font-weight: bold; color: #4a5568; }
        #timer { color: #3182ce; }
        #score { color: #38a169; }
        #level { color: #805ad5; }
        
        /* 关卡通用区域 */
        .game-stage { display: none; width: 100%; min-height: 350px; }
        .game-stage.active { display: block; }

        /* 第一关：严格顺序连线样式 */
        .line-area { display: flex; justify-content: space-between; gap: 20px; }
        .column { display: flex; flex-direction: column; width: 50%; gap: 10px; }
        .item { 
            padding: 12px; background: #ffffff; border: 2px solid #cbd5e0; border-radius: 12px; 
            cursor: pointer; user-select: none; transition: all 0.2s ease; font-size: 0.95rem; 
            color: #2d3748; min-height: 55px; display: flex; align-items: center; justify-content: center; text-align: center; 
        }
        .item.locked { background: #f1f3f5; border-color: #e2e8f0; color: #a0aec0; cursor: not-allowed; }
        .item.active-target { border-color: #4a90e2; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5); font-weight: bold; }
        .item.selected { background: #ebf8ff; border-color: #3182ce; color: #2b6cb0; font-weight: bold; }
        .item.matched { background: #f0fff4; border-color: #38a169; color: #276749; pointer-events: none; opacity: 0.65; }
        .item.wrong { background: #fff5f5; border-color: #e53e3e; color: #9b2c2c; animation: shake 0.4s ease-in-out; }

        /* 第二关：拖拽思维导图样式 */
        .mindmap-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .branches { display: flex; justify-content: space-around; width: 100%; gap: 20px; margin-top: 10px; }
        .branch-box { 
            width: 45%; min-height: 180px; background: #f8fafc; border: 3px dashed #cbd5e0; 
            border-radius: 15px; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; 
            align-content: flex-start; justify-content: center; transition: all 0.3s;
        }
        .branch-box.drag-over { background: #edf2f7; border-color: #4a90e2; }
        .branch-title { width: 100%; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #2d3748; }
        #needs-box .branch-title { color: #dd6b20; }
        #wants-box .branch-title { color: #3182ce; }
        .pool-title { font-weight: bold; color: #718096; margin-top: 10px; }
        .drag-pool { 
            width: 100%; min-height: 80px; background: #edf2f7; border-radius: 12px; 
            padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
        }
        .drag-card { 
            padding: 10px 18px; background: #ffffff; border: 2px solid #cbd5e0; border-radius: 20px; 
            cursor: grab; font-weight: bold; color: #4a5568; box-shadow: 0 3px 6px rgba(0,0,0,0.05); user-select: none;
        }
        .drag-card.placed { background: #c6f6d5; border-color: #38a169; color: #22543d; cursor: default; }

        /* 第三关：竖式输入样式 */
        .math-container { display: flex; flex-direction: column; gap: 20px; align-items: center; padding: 10px; }
        .math-row { 
            display: flex; align-items: center; justify-content: space-between; 
            width: 100%; max-width: 650px; background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0;
        }
        .math-formula { font-size: 1.1rem; font-weight: bold; color: #2d3748; text-align: left; flex: 1; line-height: 1.5; }
        .math-input { 
            width: 160px; padding: 8px 12px; font-size: 1.1rem; border: 2px solid #cbd5e0; 
            border-radius: 8px; text-align: right; font-weight: bold; color: #2b6cb0;
        }
        .math-input:focus { border-color: #3182ce; outline: none; }
        .math-input.correct { background-color: #c6f6d5; border-color: #38a169; color: #22543d; pointer-events: none; }
        .math-input.incorrect { background-color: #fff5f5; border-color: #e53e3e; color: #9b2c2c; }

        /* 公共提示与按钮 */
        #msg { margin-top: 25px; font-size: 1.2rem; font-weight: bold; min-height: 35px; color: #2d3748; padding: 12px; border-radius: 8px; }
        .btn { 
            margin-top: 20px; padding: 12px 40px; background: #3182ce; color: white; border: none; 
            border-radius: 25px; cursor: pointer; font-size: 1.1rem; font-weight: bold; box-shadow: 0 4px 10px rgba(49,130,206,0.3); transition: all 0.2s;
        }
        .btn:hover { background: #2b6cb0; transform: translateY(-1px); }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    </style>
</head>
<body>

<div id="game-box">
    <h2>🪙 三年级数学单元四：钱币大冒险</h2>
    <div id="hint-text" class="hint">准备好了吗？点击下方按钮开始游戏，系统将开始正向计时！</div>
    
    <div class="stats-bar">
        <div class="stat-item">⏱️ 用时: <span id="timer">0</span> 秒</div>
        <div class="stat-item">⭐ 关卡: <span id="level">1/3</span></div>
        <div class="stat-item">✨ 得分: <span id="score">0</span></div>
    </div>
    
    <div id="stage-1" class="game-stage">
        <div class="line-area">
            <div class="column" id="left-col-1"></div>
            <div class="column" id="right-col-1"></div>
        </div>
    </div>

    <div id="stage-2" class="game-stage">
        <div class="mindmap-container">
            <div class="branches">
                <div class="branch-box" id="needs-box" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="handleDrop(event, 'needs')">
                    <div class="branch-title">🌾 需求 (Needs)</div>
                </div>
                <div class="branch-box" id="wants-box" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="handleDrop(event, 'wants')">
                    <div class="branch-title">🧸 要求 (Wants)</div>
                </div>
            </div>
            <div class="pool-title">👇 请把下面的物品拖拽到上面对应的思维导图分支中：</div>
            <div class="drag-pool" id="item-pool"></div>
        </div>
    </div>

    <div id="stage-3" class="game-stage">
        <div class="math-container" id="math-questions-box"></div>
    </div>

    <div id="msg">点击按钮启动测验！</div>
    <button id="action-btn" class="btn">开始游戏</button>
</div>

<script>
    const stage1Data = [
        { id: 1, left: "纸币印有“Singapore”及首任总统肖像", right: "元 (Dollar)" },
        { id: 2, left: "纸币印有“CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆ特南”及胡志明头像", right: "盾 (Dong)" },
        { id: 3, left: "纸币印有“Thailand”及现任泰王头像", right: "泰铢 (Baht)" },
        { id: 4, left: "纸币印有“NEGARA BRUNEI DARUSSALAM”及苏丹头像", right: "元 (Dollar) " }, 
        { id: 5, left: "纸币印有“REPUBLIKA NG PILIPINAS”字样", right: "比索 (Peso)" },
        { id: 6, left: "纸币印有“Bank Indonesia”及具有“SAMPLE”字样的水印", right: "盾 (Rupiah)" },
        { id: 7, left: "纸币印有缅甸国家标志及“Central Bank of Myanmar”字样", right: "元 (Kyat)" },
        { id: 8, left: "纸币印有老挝文字及国家纪念碑图案", right: "基普 (Kip)" },
        { id: 9, left: "纸币印有柬埔寨王宫及相关文化符号", right: "瑞尔 (Riel)" }
    ];

    const stage2Data = [
        { name: "白饭", type: "needs" }, { name: "房子", type: "needs" }, 
        { name: "衣服", type: "needs" }, { name: "水", type: "needs" },
        { name: "化妆品", type: "wants" }, { name: "零食", type: "wants" }, 
        { name: "玩具", type: "wants" }, { name: "珠宝", type: "wants" }, 
        { name: "电子游戏", type: "wants" }, { name: "智能手机", type: "wants" }
    ];

    const stage3Data = [
        { formula: "① RM1,645.90 + RM359.50 - RM1,507.10 =", ans: "RM498.30" },
        { formula: "② RM7,816.90 - RM164.40 + RM123.80 =", ans: "RM7,776.30" },
        { formula: "③ RM4,025 - RM2,703.30 - 4,270 sen =<br><small style='color:grey; font-weight:normal;'>(提示: 4,270 sen = RM42.70)</small>", ans: "RM1,279" }
    ];

    let currentStage = 1;
    let score = 0;
    let timeElapsed = 0;
    let timerInterval = null;
    let isPlaying = false;

    let selectedLeft = null, selectedRight = null, stage1Matches = 0;
    let stage2Matches = 0;

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    // 强化保护：使用 window.onload 确保按钮和元素 100% 具备可点击状态
    window.onload = function() {
        const startBtn = document.getElementById('action-btn');
        if(startBtn) {
            startBtn.onclick = initGame;
        }
    };

    function initGame() {
        score = 0; timeElapsed = 0; currentStage = 1; isPlaying = true;
        document.getElementById('action-btn').style.display = "none";
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeElapsed;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeElapsed++;
            document.getElementById('timer').innerText = timeElapsed;
        }, 1000);

        startStage1();
    }

    // ==================== 第一关逻辑：连线 ====================
    function startStage1() {
        currentStage = 1; stage1Matches = 0;
        document.getElementById('level').innerText = "1/3";
        document.getElementById('hint-text').innerHTML = "💡 <b>第一关：东南亚各国货币辨识</b><br>请严格按照从上到下的顺序作答！点击左侧处于激活状态（带蓝色外框）的题目，再在右侧找出正确答案。答对一组才会解锁下一组！";
        
        showStageContainer(1);
        const rightShuffled = shuffle([...stage1Data]);

        const leftCol = document.getElementById('left-col-1');
        const rightCol = document.getElementById('right-col-1');
        leftCol.innerHTML = ''; rightCol.innerHTML = '';

        stage1Data.forEach((item, index) => {
            let cls = "item locked";
            if (index === 0) cls = "item active-target";
            leftCol.innerHTML += `<div class="${cls}" id="s1-left-${index}" data-id="${item.id}" data-index="${index}">${item.left}</div>`;
        });

        rightShuffled.forEach(item => {
            rightCol.innerHTML += `<div class="item" data-id="${item.id}">${item.right}</div>`;
        });

        // 强力事件绑定，解决老旧浏览器 onclick 不响应的情况
        document.querySelectorAll('#left-col-1 .item').forEach(el => {
            el.addEventListener('click', function() { clickLeft1(this); });
        });
        document.querySelectorAll('#right-col-1 .item').forEach(el => {
            el.addEventListener('click', function() { clickRight1(this); });
        });

        updateMsg("请点击左边第 1 题开始匹配！", "transparent", "#2d3748");
    }

    function clickLeft1(el) {
        if (el.classList.contains('matched') || el.classList.contains('locked')) return;
        document.querySelectorAll('#left-col-1 .item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected'); selectedLeft = el; checkMatch1();
    }

    function clickRight1(el) {
        if (el.classList.contains('matched')) return;
        document.querySelectorAll('#right-col-1 .item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected'); selectedRight = el; checkMatch1();
    }

    function checkMatch1() {
        if (selectedLeft && selectedRight) {
            const leftId = parseInt(selectedLeft.getAttribute('data-id'));
            const rightId = parseInt(selectedRight.getAttribute('data-id'));
            const idx = parseInt(selectedLeft.getAttribute('data-index'));

            if (leftId === rightId) {
                selectedLeft.classList.remove('selected', 'active-target');
                selectedRight.classList.remove('selected');
                selectedLeft.classList.add('matched'); selectedRight.classList.add('matched');
                
                score += 10; stage1Matches++;
                document.getElementById('score').innerText = score;
                updateMsg("✅ 答对啦！解锁下一题。", "#d4edda", "#155724");

                const nextIdx = idx + 1;
                const nextLeft = document.getElementById(`s1-left-${nextIdx}`);
                if (nextLeft) {
                    nextLeft.classList.remove('locked'); nextLeft.classList.add('active-target');
                }
                if (stage1Matches === stage1Data.length) { setTimeout(startStage2, 1200); }
            } else {
                const l = selectedLeft, r = selectedRight;
                l.classList.add('wrong'); r.classList.add('wrong');
                updateMsg("❌ 连错了，请继续为此题寻找正确的货币！", "#fff5f5", "#e53e3e");
                setTimeout(() => { l.classList.remove('selected', 'wrong'); r.classList.remove('selected', 'wrong'); }, 400);
            }
            selectedLeft = null; selectedRight = null;
        }
    }

    // ==================== 第二关逻辑：思维导图拖拽 ====================
    function startStage2() {
        currentStage = 2; stage2Matches = 0;
        document.getElementById('level').innerText = "2/3";
        document.getElementById('hint-text').innerHTML = "💡 <b>第二关：理财观念树形分类图</b><br>请用鼠标按住下方的物品，手动将它们拖拽移动到上方的<b>【需求】</b>或<b>【要求】</b>分类框里！";
        showStageContainer(2);

        document.getElementById('needs-box').innerHTML = '<div class="branch-title">🌾 需求 (Needs)</div>';
        document.getElementById('wants-box').innerHTML = '<div class="branch-title">🧸 要求 (Wants)</div>';

        const shuffledPool = shuffle([...stage2Data]);
        const poolEl = document.getElementById('item-pool');
        poolEl.innerHTML = '';
        shuffledPool.forEach((item, index) => {
            poolEl.innerHTML += `<div class="drag-card" id="card-${index}" draggable="true" ondragstart="dragStart(event)" data-type="${item.type}">${item.name}</div>`;
        });
        updateMsg("请把物品卡片拖入上方分类树分支中！", "transparent", "#2d3748");
    }

    function dragStart(e) { e.dataTransfer.setData("text/plain", e.target.id); }
    function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function handleDrop(e, targetType) {
        e.preventDefault();
        const box = e.currentTarget; box.classList.remove('drag-over');
        
        const cardId = e.dataTransfer.getData("text/plain");
        const cardEl = document.getElementById(cardId);
        if(!cardEl) return;
        const itemType = cardEl.getAttribute('data-type');

        if (itemType === targetType) {
            cardEl.removeAttribute('draggable'); cardEl.classList.add('placed');
            box.appendChild(cardEl);
            score += 10; stage2Matches++;
            document.getElementById('score').innerText = score;
            updateMsg(`✅ 分类正确！“${cardEl.innerText}”属于${targetType === 'needs'?'需求':'要求'}。`, "#d4edda", "#155724");
            if (stage2Matches === stage2Data.length) { setTimeout(startStage3, 1500); }
        } else {
            updateMsg(`❌ 放错啦！“${cardEl.innerText}”不属于这一类，再想想！`, "#fff5f5", "#e53e3e");
        }
    }

    // ==================== 第三关逻辑：严格规范限制输入 ====================
    function startStage3() {
        currentStage = 3;
        document.getElementById('level').innerText = "3/3";
        document.getElementById('hint-text').innerHTML = "💡 <b>第三关：RM10,000以内钱币运算练习</b><br>请在草稿纸上使用<b>竖式进行计算</b>，并在右侧输入结果。<br>⚠️ <b>注意：</b>钱币单位必须严格写成大写 <b>RM</b>（例如：<b>RM498.30</b>）。如果写成小写 rm 系统会判定为错误！";
        showStageContainer(3);

        const container = document.getElementById('math-questions-box');
        container.innerHTML = '';

        stage3Data.forEach((q, index) => {
            container.innerHTML += `
                <div class="math-row">
                    <div class="math-formula">${q.formula}</div>
                    <input type="text" class="math-input" id="math-ans-${index}" placeholder="输入结果">
                </div>
            `;
        });

        // 核心加固：改用专门的独立 EventListener 绑定，确保在各种平台下输入框都能完美响应点击与输入
        stage3Data.forEach((q, index) => {
            const inputEl = document.getElementById(`math-ans-${index}`);
            if(inputEl) {
                inputEl.addEventListener('input', function() {
                    checkMathAns(index);
                });
            }
        });

        updateMsg("请在纸上列竖式计算，并在右边输入标准大写 RM 答案！", "transparent", "#2d3748");
    }

    function checkMathAns(idx) {
        const inputEl = document.getElementById(`math-ans-${idx}`);
        if(!inputEl) return;
        
        let userAns = inputEl.value.trim().replace(/\s+/g, '').replace(/,/g, ''); // 只移空格和逗号
        const standardAns = stage3Data[idx].ans.replace(/,/g, '');

        // 学生写小写 rm，立刻判定为错误并报红
        if (userAns.startsWith('rm')) {
            inputEl.classList.add('incorrect');
            updateMsg("❌ 错误！钱币单位书写不规范，必须使用大写 RM，小写 rm 是不对的！", "#fff5f5", "#e53e3e");
            return;
        }

        if (userAns === standardAns) {
            inputEl.classList.remove('incorrect');
            inputEl.classList.add('correct');
            score += 20;
            document.getElementById('score').innerText = score;
            updateMsg("✅ 竖式计算及书写完全正确！获得 20 分！", "#d4edda", "#155724");

            let allDone = true;
            for(let i=0; i<stage3Data.length; i++) {
                const inp = document.getElementById(`math-ans-${i}`);
                if(!inp || !inp.classList.contains('correct')) allDone = false;
            }
            if(allDone) { setTimeout(endGame, 1000); }
        } else {
            if (userAns.length >= standardAns.length) {
                inputEl.classList.add('incorrect');
                updateMsg("❌ 答案不正确，请重新检查你的竖式计算和单位大小写！", "#fff5f5", "#e53e3e");
            } else {
                inputEl.classList.remove('incorrect');
            }
        }
    }

    // ==================== 工具公共函数 ====================
    function showStageContainer(stageNum) {
        document.querySelectorAll('.game-stage').forEach(s => s.classList.remove('active'));
        const activeStage = document.getElementById(`stage-${stageNum}`);
        if(activeStage) activeStage.classList.add('active');
    }

    function updateMsg(text, bgColor, textColor) {
        const msg = document.getElementById('msg');
        if(msg) {
            msg.innerHTML = text; msg.style.backgroundColor = bgColor; msg.style.color = textColor;
        }
    }

    function endGame() {
        clearInterval(timerInterval); isPlaying = false;
        document.querySelectorAll('.game-stage').forEach(s => s.classList.remove('active'));
        
        const btn = document.getElementById('action-btn');
        if(btn) {
            btn.style.display = "inline-block"; btn.innerText = "重新挑战";
            btn.onclick = initGame; // 保证重洗页面可点
        }
        
        document.getElementById('hint-text').innerHTML = "🎉 挑战达成！";
        updateMsg(
            `🏆 <b>恭喜完美通过全部三关测试！</b><br>` +
            `✨ 最终总得分：<span style='color:#38a169; font-size:1.4rem;'>${score}</span> 分<br>` +
            `⏱️ 测验总耗时：<span style='color:#e53e3e; font-size:1.4rem;'>${timeElapsed}</span> 秒！<br>` +
            `<small style='color:#718096;'>不仅竖式算得准，RM 货币单位书写也完全规范，太棒了！</small>`, 
            "#ebf8ff", "#2b6cb0"
        );
    }
</script>

</body>
</html>
