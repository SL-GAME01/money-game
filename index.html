<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：钱币大冒险</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px; 
        }
        #game-box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 800px; 
            width: 100%;
            text-align: center; 
            border: 4px solid #4a90e2; 
        }
        .hint { 
            color: #4a5568; 
            background: #ebf8ff; 
            padding: 12px; 
            border-radius: 10px; 
            border-left: 5px solid #3182ce;
            text-align: left;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .stats-bar { 
            display: flex; 
            justify-content: space-between;
            background: #edf2f7; 
            padding: 12px 25px; 
            border-radius: 12px; 
            margin-bottom: 25px;
            font-weight: bold;
        }
        .game-stage { display: none; width: 100%; min-height: 320px; }
        .game-stage.active { display: block; }

        /* 第一关连线样式 */
        .line-area { display: flex; justify-content: space-between; gap: 20px; }
        .column { display: flex; flex-direction: column; width: 50%; gap: 10px; }
        .item { 
            padding: 12px; background: #ffffff; border: 2px solid #cbd5e0; border-radius: 12px; 
            cursor: pointer; min-height: 55px; display: flex; align-items: center; justify-content: center; text-align: center; 
        }
        .item.locked { background: #f1f3f5; border-color: #e2e8f0; color: #a0aec0; cursor: not-allowed; }
        .item.active-target { border-color: #4a90e2; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5); font-weight: bold; }
        .item.selected { background: #ebf8ff; border-color: #3182ce; color: #2b6cb0; font-weight: bold; }
        .item.matched { background: #f0fff4; border-color: #38a169; color: #276749; pointer-events: none; opacity: 0.6; }
        .item.wrong { background: #fff5f5; border-color: #e53e3e; color: #9b2c2c; }

        /* 第二关拖拽样式 */
        .branches { display: flex; justify-content: space-around; gap: 20px; margin: 15px 0; }
        .branch-box { 
            width: 48%; min-height: 180px; background: #f8fafc; border: 3px dashed #cbd5e0; 
            border-radius: 15px; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        .drag-pool { 
            background: #edf2f7; border-radius: 12px; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        .drag-card { 
            padding: 10px 18px; background: #ffffff; border: 2px solid #cbd5e0; border-radius: 20px; cursor: grab; font-weight: bold;
        }
        .drag-card.placed { background: #c6f6d5; border-color: #38a169; color: #22543d; cursor: default; }

        /* 第三关输入框样式 */
        .math-row { 
            display: flex; align-items: center; justify-content: space-between; 
            background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 10px;
        }
        .math-input { 
            width: 160px; padding: 8px 12px; font-size: 1.1rem; border: 2px solid #cbd5e0; 
            border-radius: 8px; text-align: right; font-weight: bold;
        }
        .math-input.correct { background-color: #c6f6d5; border-color: #38a169; color: #22543d; pointer-events: none; }
        .math-input.incorrect { background-color: #fff5f5; border-color: #e53e3e; color: #9b2c2c; }

        #msg { margin: 20px 0; font-size: 1.2rem; font-weight: bold; min-height: 35px; padding: 12px; border-radius: 8px; }
        
        /* 核心改进的按钮样式：居中且巨大显眼 */
        .btn { 
            display: inline-block;
            margin: 20px auto; 
            padding: 15px 50px; 
            background: #3182ce; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 1.3rem; 
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(49,130,206,0.4);
            transition: all 0.2s;
        }
        .btn:hover { background: #2b6cb0; transform: scale(1.05); }
    </style>
</head>
<body>

<div id="game-box">
    <h2>🪙 三年级数学单元四：钱币大冒险</h2>
    <div id="hint-text" class="hint">准备好了吗？点击下方按钮开始游戏！</div>
    
    <button id="action-btn" class="btn" onclick="initGame()">开始游戏</button>
    
    <div class="stats-bar">
        <div>⏱️ 用时: <span id="timer">0</span> 秒</div>
        <div>⭐ 关卡: <span id="level">1/3</span></div>
        <div>✨ 得分: <span id="score">0</span></div>
    </div>
    
    <div id="stage-1" class="game-stage">
        <div class="line-area">
            <div class="column" id="left-col-1"></div>
            <div class="column" id="right-col-1"></div>
        </div>
    </div>

    <div id="stage-2" class="game-stage">
        <div class="branches">
            <div class="branch-box" id="needs-box" ondragover="event.preventDefault()" ondrop="handleDrop(event, 'needs')">
                <div style="width:100%; font-weight:bold; color:#dd6b20;">🌾 需求 (Needs)</div>
            </div>
            <div class="branch-box" id="wants-box" ondragover="event.preventDefault()" ondrop="handleDrop(event, 'wants')">
                <div style="width:100%; font-weight:bold; color:#3182ce;">🧸 要求 (Wants)</div>
            </div>
        </div>
        <div style="margin: 10px 0; color:#718096;">👇 请把下面的物品拖拽到上面对应的框里：</div>
        <div class="drag-pool" id="item-pool"></div>
    </div>

    <div id="stage-3" class="game-stage">
        <div id="math-questions-box"></div>
    </div>

    <div id="msg">点击上方蓝色按钮启动测验！</div>
</div>

<script>
    const stage1Data = [
        { id: 1, left: "纸币印有“Singapore”及首任总统肖像", right: "元 (Dollar)" },
        { id: 2, left: "纸币印有“VIET NAM”及胡志明头像", right: "盾 (Dong)" },
        { id: 3, left: "纸币印有“Thailand”及现任泰王头像", right: "泰铢 (Baht)" },
        { id: 4, left: "纸币印有“BRUNEI DARUSSALAM”及苏丹头像", right: "文莱元 (Dollar)" }, 
        { id: 5, left: "纸币印有“PILIPINAS”字样", right: "比索 (Peso)" },
        { id: 6, left: "纸币印有“Bank Indonesia”字样", right: "印尼盾 (Rupiah)" },
        { id: 7, left: "纸币印有“Central Bank of Myanmar”字样", right: "缅元 (Kyat)" },
        { id: 8, left: "纸币印有老挝文字及国家纪念碑图案", right: "基普 (Kip)" },
        { id: 9, left: "纸币印有柬埔寨王宫及文化符号", right: "瑞尔 (Riel)" }
    ];

    const stage2Data = [
        { name: "白饭", type: "needs" }, { name: "房子", type: "needs" }, { name: "衣服", type: "needs" }, { name: "水", type: "needs" },
        { name: "化妆品", type: "wants" }, { name: "零食", type: "wants" }, { name: "玩具", type: "wants" }, { name: "珠宝", type: "wants" }
    ];

    const stage3Data = [
        { formula: "① RM1,645.90 + RM359.50 - RM1,507.10 =", ans: "RM498.30" },
        { formula: "② RM7,816.90 - RM164.40 + RM123.80 =", ans: "RM7,776.30" },
        { formula: "③ RM4,025 - RM2,703.30 - 4,270 sen =", ans: "RM1,279" }
    ];

    let score = 0, timeElapsed = 0, timerInterval = null;
    let selectedLeft = null, selectedRight = null, stage1Matches = 0, stage2Matches = 0;

    function initGame() {
        score = 0; timeElapsed = 0; stage1Matches = 0;
        document.getElementById('action-btn').style.display = "none"; // 点击后立刻完美隐藏
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeElapsed;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeElapsed++;
            document.getElementById('timer').innerText = timeElapsed;
        }, 1000);

        startStage1();
    }

    function startStage1() {
        document.getElementById('level').innerText = "1/3";
        document.getElementById('hint-text').innerHTML = "💡 <b>第一关：东南亚各国货币辨识</b><br>请严格按从上到下的顺序作答！点击左侧亮起的题目，再点击右侧正确货币。";
        showStage(1);

        const leftCol = document.getElementById('left-col-1');
        const rightCol = document.getElementById('right-col-1');
        leftCol.innerHTML = ''; rightCol.innerHTML = '';

        stage1Data.forEach((item, index) => {
            let cls = index === 0 ? "item active-target" : "item locked";
            leftCol.innerHTML += `<div class="${cls}" id="s1-left-${index}" data-id="${item.id}" data-index="${index}" onclick="clickLeft1(this)">${item.left}</div>`;
        });

        const shuffledRight = [...stage1Data].sort(() => Math.random() - 0.5);
        shuffledRight.forEach(item => {
            rightCol.innerHTML += `<div class="item" data-id="${item.id}" onclick="clickRight1(this)">${item.right}</div>`;
        });
        updateMsg("请选择左边第 1 题开始！", "transparent", "#2d3748");
    }

    function clickLeft1(el) {
        if (el.classList.contains('matched') || el.classList.contains('locked')) return;
        document.querySelectorAll('#left-col-1 .item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected'); selectedLeft = el; checkMatch1();
    }

    function clickRight1(el) {
        if (el.classList.contains('matched')) return;
        document.querySelectorAll('#right-col-1 .item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected'); selectedRight = el; checkMatch1();
    }

    function checkMatch1() {
        if (selectedLeft && selectedRight) {
            if (selectedLeft.getAttribute('data-id') === selectedRight.getAttribute('data-id')) {
                selectedLeft.className = "item matched"; selectedRight.className = "item matched";
                score += 10; stage1Matches++;
                document.getElementById('score').innerText = score;
                updateMsg("✅ 答对啦！解锁下一题。", "#d4edda", "#155724");

                const nextIdx = parseInt(selectedLeft.getAttribute('data-index')) + 1;
                const nextLeft = document.getElementById(`s1-left-${nextIdx}`);
                if (nextLeft) { nextLeft.className = "item active-target"; }
                if (stage1Matches === stage1Data.length) { setTimeout(startStage2, 1000); }
            } else {
                const l = selectedLeft, r = selectedRight;
                l.classList.add('wrong'); r.classList.add('wrong');
                updateMsg("❌ 连错了，请继续为此题寻找正确的货币！", "#fff5f5", "#e53e3e");
                setTimeout(() => { l.classList.remove('selected', 'wrong'); r.classList.remove('selected', 'wrong'); }, 400);
            }
            selectedLeft = null; selectedRight = null;
        }
    }

    function startStage2() {
        document.getElementById('level').innerText = "2/3";
        document.getElementById('hint-text').innerHTML = "💡 <b>第二关：需求与要求分类</b><br>请按住并拖拽下方卡片到上面的虚线框里！";
        showStage(2);
        stage2Matches = 0;

        const pool = document.getElementById('item-pool');
        pool.innerHTML = '';
        [...stage2Data].sort(() => Math.random() - 0.5).forEach((item, i) => {
            pool.innerHTML += `<div class="drag-card" id="card-${i}" draggable="true" ondragstart="event.dataTransfer.setData('text',event.target.id)" data-type="${item.type}">${item.name}</div>`;
        });
        updateMsg("请把物品分类放入上面的格子。", "transparent", "#2d3748");
    }

    function handleDrop(e, targetType) {
        e.preventDefault();
        const id = e.dataTransfer.getData("text");
        const card = document.getElementById(id);
        if(!card) return;
        if(card.getAttribute('data-type') === targetType) {
            card.removeAttribute('draggable'); card.classList.add('placed');
            e.currentTarget.appendChild(card);
            score += 10; stage2Matches++;
            document.getElementById('score').innerText = score;
            if(stage2Matches === stage2Data.length) { setTimeout(startStage3, 1000); }
        } else {
            updateMsg("❌ 放错分类框啦，再想想！", "#fff5f5", "#e53e3e");
        }
    }

    function startStage3() {
        document.getElementById('level').innerText = "3/3";
        document.getElementById('hint-text').innerHTML = "💡 <b>第三关：钱币竖式运算</b><br>⚠️ <b>注意：</b>钱币单位必须写成大写 <b>RM</b>（如：<b>RM498.30</b>）。如果写小写 rm 会直接判错红框！";
        showStage(3);

        const container = document.getElementById('math-questions-box');
        container.innerHTML = '';
        stage3Data.forEach((q, i) => {
            container.innerHTML += `
                <div class="math-row">
                    <div style="font-weight:bold;">${q.formula}</div>
                    <input type="text" class="math-input" id="math-ans-${i}" placeholder="输入结果" oninput="checkMathAns(${i})">
                </div>
            `;
        });
        updateMsg("请在草稿纸上列竖式，并在此输入大写 RM 的正确结果。", "transparent", "#2d3748");
    }

    function checkMathAns(idx) {
        const inputEl = document.getElementById(`math-ans-${idx}`);
        let val = inputEl.value.trim().replace(/,/g, '');
        const target = stage3Data[idx].ans.replace(/,/g, '');

        // 核心要求：输入小写rm直接变红拦截！
        if (val.startsWith('rm')) {
            inputEl.className = "math-input incorrect";
            updateMsg("❌ 错误！钱币单位书写不规范，小写 rm 是不对的，必须使用大写 RM！", "#fff5f5", "#e53e3e");
            return;
        }

        if (val === target) {
            inputEl.className = "math-input correct";
            score += 20; document.getElementById('score').innerText = score;
            updateMsg("✅ 完全正确！获得 20 分！", "#d4edda", "#155724");

            let allDone = true;
            for(let i=0; i<stage3Data.length; i++) {
                if(!document.getElementById(`math-ans-${i}`).classList.contains('correct')) allDone = false;
            }
            if(allDone) { endGame(); }
        } else {
            if (val.length >= target.length) {
                inputEl.className = "math-input incorrect";
                updateMsg("❌ 答案不正确，请重新检查！", "#fff5f5", "#e53e3e");
            } else {
                inputEl.className = "math-input";
            }
        }
    }

    function showStage(num) {
        document.querySelectorAll('.game-stage').forEach(s => s.style.display = 'none');
        if(num > 0) document.getElementById(`stage-${num}`).style.display = 'block';
    }

    function updateMsg(txt, bg, color) {
        const m = document.getElementById('msg');
        m.innerHTML = txt; m.style.backgroundColor = bg; m.style.color = color;
    }

    function endGame() {
        clearInterval(timerInterval);
        showStage(0);
        const btn = document.getElementById('action-btn');
        btn.style.display = "block";
        btn.innerText = "重新挑战";
        updateMsg(`🏆 <b>通关成功！总得分：${score} 分，耗时：${timeElapsed} 秒！</b>`, "#ebf8ff", "#2b6cb0");
    }
</script>

</body>
</html>
