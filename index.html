<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级数学：钱币大冒险</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px; 
        }
        #game-box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 800px; 
            width: 100%;
            text-align: center; 
            border: 4px solid #4a90e2; 
        }
        .hint { 
            color: #4a5568; 
            background: #ebf8ff; 
            padding: 12px; 
            border-radius: 10px; 
            border-left: 5px solid #3182ce;
            text-align: left;
            margin-bottom: 20px;
        }
        .stats-bar { 
            display: flex; 
            justify-content: space-between;
            background: #edf2f7; 
            padding: 12px 25px; 
            border-radius: 12px; 
            margin-bottom: 25px;
            font-weight: bold;
        }
        .game-stage { display: none; width: 100%; min-height: 300px; }
        .game-stage.active { display: block; }

        /* 连线 */
        .line-area { display: flex; justify-content: space-between; gap: 20px; }
        .column { display: flex; flex-direction: column; width: 50%; gap: 10px; }
        .item { 
            padding: 12px; background: #ffffff; border: 2px solid #cbd5e0; border-radius: 12px; 
            cursor: pointer; min-height: 55px; display: flex; align-items: center; justify-content: center; text-align: center; 
        }
        .item.locked { background: #f1f3f5; border-color: #e2e8f0; color: #a0aec0; cursor: not-allowed; }
        .item.active-target { border-color: #4a90e2; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5); font-weight: bold; }
        .item.selected { background: #ebf8ff; border-color: #3182ce; color: #2b6cb0; font-weight: bold; }
        .item.matched { background: #f0fff4; border-color: #38a169; color: #276749; pointer-events: none; opacity: 0.6; }
        .item.wrong { background: #fff5f5; border-color: #e53e3e; color: #9b2c2c; }

        /* 拖拽分类 */
        .branches { display: flex; justify-content: space-around; gap: 20px; margin: 15px 0; }
        .branch-box { 
            width: 48%; min-height: 180px; background: #f8fafc; border: 3px dashed #cbd5e0; 
            border-radius: 15px; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        .drag-pool { 
            background: #edf2f7; border-radius: 12px; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        .drag-card { 
            padding: 10px 18px; background: #ffffff; border: 2px solid #cbd5e0; border-radius: 20px; cursor: grab; font-weight: bold;
        }
        .drag-card.placed { background: #c6f6d5; border-color: #38a169; color: #22543d; cursor: default; }

        /* 输入框 */
        .math-row { 
            display: flex; align-items: center; justify-content: space-between; 
            background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 10px;
        }
        .math-input { 
            width: 160px; padding: 8px 12px; font-size: 1.1rem; border: 2px solid #cbd5e0; 
            border-radius: 8px; text-align: right; font-weight: bold;
        }
        .math-input.correct { background-color: #c6f6d5; border-color: #38a169; color: #22543d; pointer-events: none; }
        .math-input.incorrect { background-color: #fff5f5; border-color: #e53e3e; color: #9b2c2c; }

        #msg { margin-top: 25px; font-size: 1.2rem; font-weight: bold; min-height: 35px; padding: 12px; border-radius: 8px; }
        .btn { 
            margin-top: 20px; padding: 12px 40px; background: #3182ce; color: white; border: none; 
            border-radius: 25px; cursor: pointer; font-size: 1.1rem; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-box">
    <h2>🪙 三年级数学单元四：钱币大冒险</h2>
    <div id="hint-text" class="hint">准备好了吗？点击下方按钮开始游戏！</div>
    
    <div class="stats-bar">
        <div>⏱️ 用时: <span id="timer">0</span> 秒</div>
        <div>⭐ 关卡: <span id="level">1/3</span></div>
        <div>✨ 得分: <span id="score">0</span></div>
    </div>
    
    <div id="stage-1" class="game-stage">
        <div class="line-area">
            <div class="column" id="left-col-1"></div>
            <div class="column" id="right-col-1"></div>
        </div>
    </div>

    <div id="stage-2" class="game-stage">
        <div class="branches">
            <div class="branch-box" id="needs-box" ondragover="event.preventDefault()" ondrop="handleDrop(event, 'needs')">
                <div style="width:100%; font-weight:bold; color:#dd6b20;">
