<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东盟国家钱币辨识 Quiz</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background-color: #f7fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px; 
        }
        #quiz-card { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
            max-width: 600px; 
            width: 100%; 
            text-align: center; 
            border: 3px solid #3182ce; 
        }
        
        /* 核心课本图片切片展示区 */
        #image-viewer {
            display: none;
            width: 100%;
            height: 180px;
            margin: 15px auto;
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            background-image: url('https://images.weserv.nl/?url=raw.githubusercontent.com/sl-game01/money-game/main/image_9e3141.jpg');
            background-repeat: no-repeat;
            background-size: 210% auto; /* 针对双页教材图精准缩放 */
            transition: background-position 0.2s ease-in-out;
        }

        .hint-box { 
            color: #4a5568; 
            background: #ebf8ff; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            font-size: 0.95rem;
        }
        .score-board { 
            display: flex; 
            justify-content: space-between; 
            background: #edf2f7; 
            padding: 10px 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-weight: bold; 
        }
        #quiz-main { display: none; text-align: left; }
        .q-title { font-size: 1.15rem; font-weight: bold; color: #2d3748; margin-bottom: 15px; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        
        .opt-btn { 
            width: 100%; 
            padding: 14px 18px; 
            font-size: 1rem; 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            cursor: pointer; 
            text-align: left; 
            color: #4a5568; 
            transition: background 0.1s;
        }
        .opt-btn:hover:not(:disabled) { background: #edf2f7; }
        .opt-btn.correct { background: #c6f6d5 !important; border-color: #38a169 !important; color: #22543d !important; font-weight: bold; }
        .opt-btn.incorrect { background: #fff5f5 !important; border-color: #e53e3e !important; color: #9b2c2c !important; }
        
        #feedback { margin: 15px 0; font-size: 1.1rem; font-weight: bold; min-height: 40px; padding: 10px; border-radius: 6px; text-align: center; }
        
        .control-btn { 
            display: inline-block; 
            padding: 12px 40px; 
            background: #3182ce; 
            color: white; 
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: bold; 
            box-shadow: 0 4px 12px rgba(49,130,206,0.3); 
            margin-top: 10px;
        }
        .control-btn:hover { background: #2b6cb0; }
    </style>
</head>
<body>

<div id="quiz-card">
    <h2>🪙 看图识钱币：东盟国家大挑战</h2>
    <div id="welcome-hint" class="hint-box">请仔细观察出现的课本钱币与国旗图片，选出它属于哪一个东盟国家吧！</div>
    
    <div>
        <button id="start-node" class="control-btn" onclick="bootGame()">开始游戏</button>
    </div>
    
    <div class="score-board">
        <div>📋 进度: <span id="ui-progress">0 / 8</span></div>
        <div>✨ 得分: <span id="ui-score">0</span></div>
    </div>
    
    <div id="image-viewer"></div>
    
    <div id="quiz-main">
        <div class="q-title" id="ui-question">题目加载中...</div>
        <div class="options-grid">
            <button class="opt-btn" onclick="verifyChoice(this)"></button>
            <button class="opt-btn" onclick="verifyChoice(this)"></button>
            <button class="opt-btn" onclick="verifyChoice(this)"></button>
            <button class="opt-btn" onclick="verifyChoice(this)"></button>
        </div>
    </div>

    <div id="feedback">点击上方蓝色按钮启动闯关！</div>
    
    <div>
        <button id="next-node" class="control-btn" style="display: none;" onclick="shiftNext()">下一题 ➡️</button>
    </div>
</div>

<script>
    // 严格按照您的 image_9e3141.jpg 课本内容与坐标比例切片定制的题库数据
    const database = [
        { country: "马来西亚", choices: ["新加坡", "泰国", "马来西亚", "文莱"], pos: "5% 58%" },
        { country: "泰国", choices: ["老挝", "泰国", "柬埔寨", "缅甸"], pos: "24% 58%" },
        { country: "新加坡", choices: ["文莱", "印度尼西亚", "新加坡", "越南"], pos: "5% 88%" },
        { country: "文莱", choices: ["文莱", "菲律宾", "马来西亚", "老挝"], pos: "24% 88%" },
        { country: "印度尼西亚", choices: ["缅甸", "越南", "柬埔寨", "印度尼西亚"], pos: "44% 88%" },
        { country: "菲律宾", choices: ["菲律宾", "泰国", "马来西亚", "新加坡"], pos: "58% 18%" },
        { country: "越南", choices: ["老挝", "柬埔寨", "越南", "缅甸"], pos: "79% 18%" },
        { country: "缅甸", choices: ["缅甸", "文莱", "印度尼西亚", "泰国"], pos: "100% 18%" },
        { country: "老挝", choices: ["柬埔寨", "老挝", "菲律宾", "越南"], pos: "58% 50%" },
        { country: "柬埔寨", choices: ["马来西亚", "泰国", "老挝", "柬埔寨"], pos: "79% 50%" }
    ];

    let ptr = 0, currentScore = 0, isLock = false;

    function bootGame() {
        ptr = 0; 
        currentScore = 0; 
        isLock = false;
        document.getElementById('start-node').style.display = "none";
        document.getElementById('quiz-main').style.display = "block";
        document.getElementById('image-viewer').style.display = "block";
        document.getElementById('ui-score').innerText = currentScore;
        drawQuestion();
    }

    function drawQuestion() {
        isLock = false;
        document.getElementById('next-node').style.display = "none";
        pushLog("请观察上方的课本插图，选出正确的国家名称。", "transparent", "#2d3748");
        document.getElementById('ui-progress').innerText = `${ptr + 1} / ${database.length}`;

        const item = database[ptr];
        document.getElementById('ui-question').innerText = `第 ${ptr + 1} 题：请问这张钱币面值与国旗，属于哪一个东盟国家？`;
        
        // 核心切片：自动将视角锁定到课本对应国家的图片区域
        document.getElementById('image-viewer').style.backgroundPosition = item.pos;

        const selectors = document.querySelectorAll('.opt-btn');
        selectors.forEach((btn, i) => {
            btn.className = "opt-btn";
            btn.innerText = item.choices[i];
            btn.disabled = false;
        });
    }

    function verifyChoice(target) {
        if (isLock) return;
        isLock = true;

        const item = database[ptr];
        const selectors = document.querySelectorAll('.opt-btn');
        selectors.forEach(btn => btn.disabled = true);

        if (target.innerText === item.country) {
            target.classList.add('correct');
            currentScore += 10;
            document.getElementById('ui-score').innerText = currentScore;
            pushLog("✅ 答对了！对该国钱币非常熟悉！", "#d4edda", "#155724");
        } else {
            target.classList.add('incorrect');
            selectors.forEach(btn => { 
                if (btn.innerText === item.country) btn.classList.add('correct'); 
            });
            pushLog(`❌ 答错啦！正确答案应该是：<b>${item.country}</b>`, "#fff5f5", "#e53e3e");
        }
        document.getElementById('next-node').style.display = "inline-block";
    }

    function shiftNext() {
        ptr++;
        if (ptr < database.length) { 
            drawQuestion(); 
        } else { 
            wrapGame(); 
        }
    }

    function pushLog(txt, bg, clr) {
        const box = document.getElementById('feedback'); 
        box.innerHTML = txt; 
        box.style.backgroundColor = bg; 
        box.style.color = clr;
    }

    function wrapGame() {
        document.getElementById('quiz-main').style.display = "none";
        document.getElementById('image-viewer').style.display = "none";
        document.getElementById('next-node').style.display = "none";
        
        const sBtn = document.getElementById('start-node');
        sBtn.style.display = "inline-block";
        sBtn.innerText = "重新挑战";
        
        let praise = currentScore === 100 ? "🥇 满分！你完全辨识了东盟所有成员国的钱币！" : "👍 挑战完成！可以再试一次获得全对哦！";
        pushLog(`🎉 <b>智力通关！闯关结束！</b><br>最终得分：<span style='color:#3182ce; font-size:1.6rem;'>${currentScore}</span> 分<br><br>${praise}`, "#ebf8ff", "#2b6cb0");
    }
</script>

</body>
</html>
