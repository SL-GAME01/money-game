<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>同音字小达人 ✏️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            touch-action: manipulation;
            user-select: none;
            background: linear-gradient(135deg, #a855f7 0%, #3b82f6 50%, #06b6d4 100%);
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 md:p-4 text-slate-800">

    <!-- 游戏主容器 -->
    <div class="relative w-full max-w-2xl bg-white/95 backdrop-blur-md border-4 border-yellow-300 rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-[500px]">
        
        <!-- 顶栏：信息显示区 -->
        <div id="topBar" class="hidden bg-yellow-100 border-b-2 border-yellow-200 p-3 flex justify-between items-center z-10">
            <div class="flex items-center gap-2">
                <span id="playerBadge" class="bg-purple-500 text-white px-3 py-1 rounded-xl text-xs font-black">
                    👤 玩家: <span id="displayName">小学霸</span>
                </span>
                <span class="bg-blue-500 text-white px-3 py-1 rounded-xl text-xs font-black">
                    同音字大挑战 🎯
                </span>
            </div>
            <div class="flex items-center gap-3 font-black text-sm">
                <span class="text-emerald-600"><i class="fas fa-star text-yellow-400"></i> 得分: <span id="scoreText">0</span></span>
                <span class="text-rose-500"><i class="fas fa-clock"></i> <span id="timerText">0s</span></span>
            </div>
        </div>

        <!-- 视图 1：开始界面 -->
        <div id="startScreen" class="flex-1 flex flex-col items-center justify-center p-6 text-center animate-pop">
            <div class="text-6xl mb-4">✏️📚</div>
            <h1 class="text-3xl font-black text-purple-700 mb-2">同音字大冒险</h1>
            <p class="text-slate-500 text-sm mb-6">识字一至第 8 单元 · 闯关练习</p>
            
            <div class="w-full max-w-xs space-y-3">
                <div class="text-left text-xs font-bold text-slate-500 mb-1 ml-1">请输入你的名字：</div>
                <input type="text" id="playerNameInput" placeholder="例如：小明" 
                       class="w-full px-4 py-3 border-2 border-purple-200 rounded-2xl text-center font-bold text-slate-700 focus:outline-none focus:border-purple-500 transition shadow-inner">
                
                <button onclick="startGame()" 
                        class="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white font-black py-3.5 rounded-2xl shadow-lg transform active:scale-95 transition text-lg">
                    开始挑战 🚀
                </button>
            </div>
        </div>

        <!-- 视图 2：游戏核心关卡区 -->
        <div id="gameScreen" class="hidden flex-1 p-4 md:p-6 flex flex-col justify-between relative">
            <div id="gameZone" class="flex-1 flex flex-col justify-center">
                <!-- 动态渲染题目 -->
            </div>

            <!-- 答错时的正解弹窗 (按 OK 后继续) -->
            <div id="feedbackOverlay" class="hidden absolute inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-20 p-4">
                <div class="bg-white rounded-3xl p-6 border-4 border-rose-400 shadow-2xl text-center max-w-xs w-full animate-pop">
                    <div class="text-4xl mb-2">💡</div>
                    <div class="text-slate-500 font-bold text-sm mb-2">仔细看一看正确的搭配哦：</div>
                    
                    <div class="bg-rose-50 border-2 border-rose-200 rounded-2xl p-3 my-3">
                        <div class="text-xs text-rose-400 font-bold mb-1">读音: <span id="feedbackPinyin"></span></div>
                        <div class="text-2xl font-black text-slate-800">
                            <span id="feedbackChar" class="text-rose-500 font-black"></span>
                            <span class="text-slate-400 text-lg mx-1">➔</span>
                            <span id="feedbackWord" class="text-purple-700 font-black"></span>
                        </div>
                    </div>

                    <button onclick="confirmFeedback()" 
                            class="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black py-2.5 rounded-xl shadow-md transition transform active:scale-95 text-base mt-2">
                        我知道了 🆗
                    </button>
                </div>
            </div>
        </div>

        <!-- 视图 3：游戏结算界面 -->
        <div id="endScreen" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center animate-pop">
            <div class="text-6xl mb-3">🎉🏆</div>
            <h2 class="text-2xl font-black text-slate-800 mb-1">完成挑战！</h2>
            <p class="text-slate-500 text-sm mb-4">太棒了，你完成了所有的题目！</p>
            
            <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 w-full max-w-xs mb-6">
                <div class="text-sm text-slate-600 mb-1">本次最终得分</div>
                <div class="text-3xl font-black text-amber-600 mb-2"><span id="finalScore">0</span> 分</div>
                <div class="text-xs text-slate-500">总用时：<span id="finalTime">0</span> 秒</div>
            </div>

            <div class="w-full max-w-xs space-y-3">
                <button onclick="restartGame()" 
                        class="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black py-3 rounded-2xl shadow-md transition transform active:scale-95">
                    再练一次 🔄
                </button>
            </div>
        </div>

    </div>

    <script>
        // 音效系统
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        const Sound = {
            correct() {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            },
            wrong() {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(130, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            },
            win() {
                const ctx = getAudioContext();
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const now = ctx.currentTime + idx * 0.1;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                });
            }
        };

        // 题目数据
        const pinyinData = [
            { pinyin: "diǎn", characters: [ { char: "典", pre: "字", post: "" }, { char: "点", pre: "", post: "头" } ] },
            { pinyin: "zhù", characters: [ { char: "祝", pre: "", post: "福" }, { char: "助", pre: "帮", post: "" }, { char: "住", pre: "居", post: "" } ] },
            { pinyin: "dài", characters: [ { char: "代", pre: "", post: "表" }, { char: "带", pre: "", post: "领" } ] },
            { pinyin: "wàng", characters: [ { char: "望", pre: "希", post: "" }, { char: "忘", pre: "", post: "记" } ] },
            { pinyin: "xíng", characters: [ { char: "形", pre: "", post: "状" }, { char: "行", pre: "", post: "人" } ] },
            { pinyin: "bù", characters: [ { char: "部", pre: "", post: "分" }, { char: "步", pre: "脚", post: "" }, { char: "布", pre: "", post: "料" } ] },
            { pinyin: "lín", characters: [ { char: "临", pre: "来", post: "" }, { char: "林", pre: "森", post: "" }, { char: "邻", pre: "", post: "居" } ] },
            { pinyin: "xiàn", characters: [ { char: "线", pre: "", post: "条" }, { char: "现", pre: "", post: "在" } ] },
            { pinyin: "duì", characters: [ { char: "队", pre: "排", post: "" }, { char: "对", pre: "", post: "面" } ] }
        ];

        // 洗牌算法
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 状态管理
        let currentPlayerName = "小学霸";
        let currentQuestionIdx = 0;
        let score = 0;
        let timerSeconds = 0;
        let timerInterval = null;
        let questions = [];

        function startGame() {
            const inputVal = document.getElementById('playerNameInput').value.trim();
            currentPlayerName = inputVal !== "" ? inputVal : "小学霸";
            document.getElementById('displayName').innerText = currentPlayerName;

            questions = [];
            pinyinData.forEach(group => {
                const allChars = group.characters.map(c => c.char);
                const shuffledCharacters = shuffle(group.characters);
                
                shuffledCharacters.forEach(item => {
                    questions.push({
                        pinyin: group.pinyin,
                        pre: item.pre,
                        post: item.post,
                        correctChar: item.char,
                        fullWord: `${item.pre}${item.char}${item.post}`,
                        options: shuffle(allChars)
                    });
                });
            });

            questions = shuffle(questions);

            currentQuestionIdx = 0;
            score = 0;
            timerSeconds = 0;

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('topBar').classList.remove('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds++;
                document.getElementById('timerText').innerText = `${timerSeconds}s`;
            }, 1000);

            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('scoreText').innerText = score;
            const gameZone = document.getElementById('gameZone');
            const qData = questions[currentQuestionIdx];

            gameZone.innerHTML = `
                <div class="text-center mb-6">
                    <span class="text-xs font-bold bg-blue-100 text-blue-600 px-3 py-1 rounded-full">
                        第 ${currentQuestionIdx + 1} / ${questions.length} 题
                    </span>
                    <h2 class="text-xl font-black text-slate-700 mt-3">读音 (${qData.pinyin})，请选择正确的汉字：</h2>
                    <div class="text-3xl font-black text-purple-700 mt-4 bg-purple-50 border-2 border-purple-200 py-4 rounded-2xl max-w-xs mx-auto shadow-sm">
                        ${qData.pre} <span class="text-rose-500 underline underline-offset-8">__</span> ${qData.post}
                    </div>
                </div>

                <div class="grid grid-cols-${qData.options.length > 2 ? '3' : '2'} gap-3 max-w-xs mx-auto mt-4">
                    ${qData.options.map(opt => `
                        <button onclick="checkAnswer('${opt}', '${qData.correctChar}')"
                                class="bg-white border-2 border-blue-300 hover:border-blue-500 hover:bg-blue-50 text-slate-800 font-black text-2xl py-3 rounded-2xl shadow-sm transition active:scale-95">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function checkAnswer(selected, correct) {
            const qData = questions[currentQuestionIdx];

            if (selected === correct) {
                Sound.correct();
                score += 10;
                nextQuestion();
            } else {
                Sound.wrong();

                document.getElementById('feedbackPinyin').innerText = qData.pinyin;
                document.getElementById('feedbackChar').innerText = correct;
                document.getElementById('feedbackWord').innerText = qData.fullWord;

                document.getElementById('feedbackOverlay').classList.remove('hidden');
            }
        }

        function confirmFeedback() {
            document.getElementById('feedbackOverlay').classList.add('hidden');
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIdx++;
            if (currentQuestionIdx >= questions.length) {
                endGame();
            } else {
                loadQuestion();
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            Sound.win();

            document.getElementById('topBar').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');

            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalTime').innerText = timerSeconds;
        }

        function restartGame() {
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
