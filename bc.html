<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>趣味同音字大冒险 ✏️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            touch-action: manipulation;
            user-select: none;
            background: linear-gradient(135deg, #a855f7 0%, #3b82f6 50%, #06b6d4 100%);
        }

        .drop-zone {
            transition: all 0.2s ease;
        }
        .drop-zone.drag-over {
            background-color: #fef08a;
            border-color: #eab308;
            transform: scale(1.05);
        }

        .draggable-card {
            cursor: grab;
            transition: transform 0.15s ease;
        }
        .draggable-card:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 md:p-4 text-slate-800">

    <!-- 游戏主容器 -->
    <div class="relative w-full max-w-2xl bg-white/95 backdrop-blur-md border-4 border-yellow-300 rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-[600px]">
        
        <!-- 顶栏：信息显示区 -->
        <div id="topBar" class="hidden bg-yellow-100 border-b-2 border-yellow-200 p-3 flex justify-between items-center z-10">
            <div class="flex items-center gap-2">
                <span id="playerBadge" class="bg-purple-500 text-white px-3 py-1 rounded-xl text-xs font-black">
                    👤 玩家: <span id="displayName">--</span>
                </span>
                <span id="stageBadge" class="bg-blue-500 text-white px-3 py-1 rounded-xl text-xs font-black">
                    第一阶段：拖拽填空 🧩
                </span>
            </div>
            <div class="flex items-center gap-3 font-black text-sm">
                <span class="text-emerald-600"><i class="fas fa-star text-yellow-400"></i> 得分: <span id="scoreText">0</span></span>
                <span class="text-rose-500"><i class="fas fa-clock"></i> <span id="timerText">0s</span></span>
            </div>
        </div>

        <!-- 视图 1：开始界面（输入名字） -->
        <div id="startScreen" class="flex-1 flex flex-col items-center justify-center p-6 text-center animate-pop">
            <div class="text-6xl mb-4">✏️📚</div>
            <h1 class="text-3xl font-black text-purple-700 mb-2">同音字大冒险</h1>
            <p class="text-slate-500 text-sm mb-6">识字一至第 8 单元 · 同音字闯关竞赛</p>
            
            <div class="w-full max-w-xs space-y-4">
                <input type="text" id="playerNameInput" placeholder="请输入你的名字..." 
                       class="w-full px-4 py-3 rounded-2xl border-2 border-purple-300 focus:border-purple-500 outline-none text-center font-bold text-lg shadow-inner">
                <button onclick="startGame()" 
                        class="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white font-black py-3.5 rounded-2xl shadow-lg transform active:scale-95 transition text-lg">
                    开始挑战 🚀
                </button>
            </div>

            <!-- 本地排行榜展示 -->
            <div class="mt-8 w-full max-w-xs bg-slate-50 rounded-2xl p-4 border border-slate-200">
                <h3 class="font-black text-slate-700 text-sm mb-2 flex items-center justify-center gap-1">
                    🏆 英雄排行榜 (Top 5)
                </h3>
                <div id="miniLeaderboard" class="text-xs text-slate-600 space-y-1">
                    <!-- 动态加载排行榜 -->
                </div>
            </div>
        </div>

        <!-- 视图 2：游戏核心关卡区 -->
        <div id="gameScreen" class="hidden flex-1 p-4 md:p-6 flex flex-col justify-between">
            <div id="gameZone" class="flex-1 flex flex-col justify-center">
                <!-- 动态内容渲染 -->
            </div>
        </div>

        <!-- 视图 3：游戏结算界面 -->
        <div id="endScreen" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center animate-pop">
            <div class="text-6xl mb-3">🎉🏆</div>
            <h2 class="text-2xl font-black text-slate-800 mb-1">大获全胜！</h2>
            <p class="text-slate-500 text-sm mb-4">恭喜你完成了所有同音字挑战！</p>
            
            <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 w-full max-w-xs mb-6">
                <div class="text-sm text-slate-600 mb-1">最终成绩</div>
                <div class="text-2xl font-black text-amber-600 mb-2"><span id="finalScore">0</span> 分</div>
                <div class="text-xs text-slate-500">总用时：<span id="finalTime">0</span> 秒</div>
            </div>

            <div class="w-full max-w-xs space-y-3">
                <button onclick="restartGame()" 
                        class="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black py-3 rounded-2xl shadow-md transition transform active:scale-95">
                    再玩一次 🔄
                </button>
            </div>
        </div>

    </div>

    <script>
        // Web Audio API 音效合成
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        const Sound = {
            correct() {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            },
            wrong() {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(130, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            },
            win() {
                const ctx = getAudioContext();
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const now = ctx.currentTime + idx * 0.1;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                });
            }
        };

        // 题库（来自于识字一至第8单元的同音字）
        const pinyinData = [
            { pinyin: "diǎn", characters: [ { char: "典", word: "字典", pre: "字", post: "" }, { char: "点", word: "点头", pre: "", post: "头" } ] },
            { pinyin: "zhù", characters: [ { char: "祝", word: "祝福", pre: "", post: "福" }, { char: "助", word: "帮助", pre: "帮", post: "" }, { char: "住", word: "居住", pre: "居", post: "" } ] },
            { pinyin: "dài", characters: [ { char: "代", word: "代表", pre: "", post: "表" }, { char: "带", word: "带领", pre: "", post: "领" } ] },
            { pinyin: "wàng", characters: [ { char: "望", word: "希望", pre: "希", post: "" }, { char: "忘", word: "忘记", pre: "", post: "记" } ] },
            { pinyin: "xíng", characters: [ { char: "形", word: "形状", pre: "", post: "状" }, { char: "行", word: "行人", pre: "", post: "人" } ] },
            { pinyin: "bù", characters: [ { char: "部", word: "部分", pre: "", post: "分" }, { char: "步", word: "脚步", pre: "脚", post: "" }, { char: "布", word: "布料", pre: "", post: "料" } ] },
            { pinyin: "lín", characters: [ { char: "临", word: "来临", pre: "来", post: "" }, { char: "林", word: "森林", pre: "森", post: "" }, { char: "邻", word: "邻居", pre: "", post: "居" } ] },
            { pinyin: "xiàn", characters: [ { char: "线", word: "线条", pre: "", post: "条" }, { char: "现", word: "现在", pre: "", post: "在" } ] },
            { pinyin: "duì", characters: [ { char: "队", word: "排队", pre: "排", post: "" }, { char: "对", word: "对面", pre: "", post: "面" } ] }
        ];

        // 游戏全局状态
        let playerName = "";
        let currentStage = 1; // 1 或 2
        let currentQuestionIdx = 0;
        let score = 0;
        let timerSeconds = 0;
        let timerInterval = null;
        let stage1Questions = [];
        let stage2Questions = [];
        let currentGroupCorrect = 0; // 当前拖拽题填对的个数计数器

        // 初始化/显示英雄榜
        function renderLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('homophone_leaderboard') || '[]');
            const container = document.getElementById('miniLeaderboard');
            if (leaderboard.length === 0) {
                container.innerHTML = `<div class="text-slate-400">暂无记录，快来成为第一名吧！</div>`;
                return;
            }
            container.innerHTML = leaderboard.slice(0, 5).map((item, index) => `
                <div class="flex justify-between items-center py-0.5">
                    <span class="font-bold">${index + 1}. ${item.name}</span>
                    <span class="text-slate-500">${item.score}分 (${item.time}s)</span>
                </div>
            `).join('');
        }

        // 保存成绩到排行榜
        function saveScore(name, finalScore, finalTime) {
            let leaderboard = JSON.parse(localStorage.getItem('homophone_leaderboard') || '[]');
            leaderboard.push({ name, score: finalScore, time: finalTime });
            leaderboard.sort((a, b) => b.score - a.score || a.time - b.time);
            localStorage.setItem('homophone_leaderboard', JSON.stringify(leaderboard));
        }

        function startGame() {
            const input = document.getElementById('playerNameInput').value.trim();
            if (!input) {
                alert("请输入你的名字哦！");
                return;
            }
            playerName = input;
            document.getElementById('displayName').innerText = playerName;

            // 准备关卡数据
            stage1Questions = [...pinyinData];
            
            // 阶段2选择题生成
            stage2Questions = [];
            pinyinData.forEach(group => {
                const allChars = group.characters.map(c => c.char);
                group.characters.forEach(item => {
                    stage2Questions.push({
                        pinyin: group.pinyin,
                        pre: item.pre,
                        post: item.post,
                        correctChar: item.char,
                        options: allChars
                    });
                });
            });
            stage2Questions.sort(() => Math.random() - 0.5);

            // 重置数据
            currentStage = 1;
            currentQuestionIdx = 0;
            score = 0;
            timerSeconds = 0;

            // UI 切换
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('topBar').classList.remove('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            // 启动计时器
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds++;
                document.getElementById('timerText').innerText = `${timerSeconds}s`;
            }, 1000);

            loadStageQuestion();
        }

        function loadStageQuestion() {
            document.getElementById('scoreText').innerText = score;
            const gameZone = document.getElementById('gameZone');

            if (currentStage === 1) {
                currentGroupCorrect = 0; // 重置本组答对的计数
                document.getElementById('stageBadge').innerText = "第一阶段：拖拽填空 🧩";
                const qData = stage1Questions[currentQuestionIdx];
                
                gameZone.innerHTML = `
                    <div class="text-center mb-6">
                        <span class="text-xs font-bold bg-purple-100 text-purple-600 px-3 py-1 rounded-full">
                            第 ${currentQuestionIdx + 1} / ${stage1Questions.length} 组
                        </span>
                        <h2 class="text-2xl font-black text-slate-800 mt-2">拼音: <span class="text-purple-600 font-serif">${qData.pinyin}</span></h2>
                        <p class="text-xs text-slate-500 mt-1">请将正确的汉字拖拽到对应的词语空格中</p>
                    </div>

                    <!-- 可拖拽字卡 -->
                    <div class="flex justify-center gap-4 mb-8" id="draggableContainer">
                        ${qData.characters.map((item) => `
                            <div class="draggable-card bg-amber-300 hover:bg-amber-400 border-2 border-amber-500 text-amber-950 font-black text-2xl w-14 h-14 rounded-2xl flex items-center justify-center shadow-md active:scale-95"
                                 draggable="true" ondragstart="handleDragStart(event, '${item.char}')">
                                ${item.char}
                            </div>
                        `).join('')}
                    </div>

                    <!-- 放置目标词语 -->
                    <div class="space-y-4 max-w-sm mx-auto">
                        ${qData.characters.map((item, idx) => `
                            <div class="bg-indigo-50 border-2 border-indigo-200 rounded-2xl p-4 flex items-center justify-center gap-2 text-xl font-bold">
                                <span>${item.pre}</span>
                                <div class="drop-zone w-12 h-12 border-2 border-dashed border-indigo-400 bg-white rounded-xl flex items-center justify-center text-purple-700 font-black text-2xl"
                                     ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${item.char}')">
                                    ?
                                </div>
                                <span>${item.post}</span>
                            </div>
                        `).join('')}
                    </div>
                `;

            } else {
                document.getElementById('stageBadge').innerText = "第二阶段：快速选择 🎯";
                const qData = stage2Questions[currentQuestionIdx];

                gameZone.innerHTML = `
                    <div class="text-center mb-6">
                        <span class="text-xs font-bold bg-blue-100 text-blue-600 px-3 py-1 rounded-full">
                            第 ${currentQuestionIdx + 1} / ${stage2Questions.length} 题
                        </span>
                        <h2 class="text-xl font-black text-slate-700 mt-3">读音 (${qData.pinyin})，选择正确的字填入：</h2>
                        <div class="text-3xl font-black text-purple-700 mt-4 bg-purple-50 border-2 border-purple-200 py-4 rounded-2xl max-w-xs mx-auto shadow-sm">
                            ${qData.pre} <span class="text-rose-500 underline underline-offset-8">__</span> ${qData.post}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 max-w-xs mx-auto mt-4">
                        ${qData.options.map(opt => `
                            <button onclick="checkStage2Answer('${opt}', '${qData.correctChar}')"
                                    class="bg-white border-2 border-blue-300 hover:border-blue-500 hover:bg-blue-50 text-slate-800 font-black text-2xl py-3 rounded-2xl shadow-sm transition active:scale-95">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                `;
            }
        }

        // --- 第一阶段拖拽逻辑 ---
        let draggedChar = null;

        function handleDragStart(e, char) {
            draggedChar = char;
            e.dataTransfer.setData("text/plain", char);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e, targetCorrectChar) {
            e.preventDefault();
            const dropZone = e.currentTarget;
            dropZone.classList.remove('drag-over');

            // 避免对同一个框重复拖拽触发
            if (dropZone.dataset.completed === "true") return;

            if (draggedChar === targetCorrectChar) {
                Sound.correct();
                dropZone.dataset.completed = "true";
                dropZone.innerText = draggedChar;
                dropZone.className = "w-12 h-12 bg-emerald-400 text-white font-black text-2xl rounded-xl flex items-center justify-center shadow-md animate-pop";
                dropZone.removeAttribute('ondragover');
                
                score += 10;
                document.getElementById('scoreText').innerText = score;

                currentGroupCorrect++; // 答对计一数
                const currentQ = stage1Questions[currentQuestionIdx];

                // 判断是否当前组的所有词语都填对了
                if (currentGroupCorrect >= currentQ.characters.length) {
                    setTimeout(() => {
                        currentQuestionIdx++;
                        if (currentQuestionIdx >= stage1Questions.length) {
                            // 进入第二阶段
                            currentStage = 2;
                            currentQuestionIdx = 0;
                            alert("🎉 太棒了！第一阶段全部通关！准备进入【第二阶段：快速选择】！");
                        }
                        loadStageQuestion();
                    }, 400);
                }
            } else {
                Sound.wrong();
                dropZone.classList.add('bg-rose-100', 'border-rose-400');
                setTimeout(() => {
                    dropZone.classList.remove('bg-rose-100', 'border-rose-400');
                }, 500);
            }
        }

        // --- 第二阶段点击逻辑 ---
        function checkStage2Answer(selected, correct) {
            if (selected === correct) {
                Sound.correct();
                score += 10;
                currentQuestionIdx++;

                if (currentQuestionIdx >= stage2Questions.length) {
                    endGame();
                } else {
                    loadStageQuestion();
                }
            } else {
                Sound.wrong();
                alert(`再想想看哦！正确答案是【${correct}】`);
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            Sound.win();

            saveScore(playerName, score, timerSeconds);

            document.getElementById('topBar').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');

            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalTime').innerText = timerSeconds;
        }

        function restartGame() {
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            renderLeaderboard();
        }

        // 页面首次加载
        renderLeaderboard();
    </script>
</body>
</html>
